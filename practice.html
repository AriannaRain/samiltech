<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장실습 자료실 — 삼일공업고등학교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1A3A6B;--primary-light:#2E5FAD;--accent:#E8740A;--accent-light:#FF9E3A;
  --bg:#F4F6FA;--card:#fff;--text:#1C2B3A;--text-sub:#5A6A7E;--border:#DDE3EE;
  --nav-h:60px;--radius:12px;--shadow:0 2px 12px rgba(26,58,107,.10)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding-top:var(--nav-h)}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--primary);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:10px;line-height:1.2;text-align:center}
.nav-title{color:#fff;font-weight:700;font-size:16px}
.nav-title span{color:rgba(255,255,255,.65);font-size:10px;display:block;font-weight:400}
.nav-menu{display:flex;gap:4px;align-items:center}
.nav-menu a{color:rgba(255,255,255,.8);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}
.nav-menu a:hover,.nav-menu a.active{background:rgba(255,255,255,.15);color:#fff}
.nav-login{background:var(--accent)!important;color:#fff!important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{width:22px;height:2px;background:#fff;border-radius:2px}
@media(max-width:768px){
  .nav-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:var(--primary);flex-direction:column;padding:12px}
  .nav-menu.open{display:flex}
  .nav-menu a{padding:12px 16px}
  .hamburger{display:flex}
}
/* 페이지 헤더 */
.page-hero{background:var(--primary);padding:32px 24px 28px;color:#fff}
.page-hero-inner{max-width:860px;margin:0 auto}
.page-hero h1{font-size:22px;font-weight:700;margin-bottom:6px}
.page-hero p{font-size:13px;color:rgba(255,255,255,.7)}
/* 컨테이너 */
.container{max-width:860px;margin:0 auto;padding:28px 16px}
/* 로그인 게이트 */
.login-gate{background:var(--card);border-radius:var(--radius);padding:56px 24px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.login-gate h3{font-size:20px;font-weight:700;margin-bottom:10px}
.login-gate p{font-size:13px;color:var(--text-sub);margin-bottom:24px;line-height:1.7}
.login-gate-btn{padding:12px 32px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
/* 자료실 */
.section-block{margin-bottom:24px}
.section-divider{display:flex;align-items:center;gap:14px;margin-bottom:14px;cursor:pointer;user-select:none}
.section-divider:hover .section-divider-title{background:var(--primary-light)}
.section-divider-line{flex:1;height:2px;background:var(--primary)}
.section-divider-title{background:var(--primary);color:#fff;padding:6px 18px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:.15s}
.section-divider-arrow{font-size:11px;transition:transform .25s}
.section-block.collapsed .section-divider-arrow{transform:rotate(-90deg)}
.section-block.collapsed .file-list{display:none}
.section-block.collapsed .empty-section{display:none}
.file-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.file-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);transition:.15s}
.file-item:last-child{border-bottom:none}
.file-item:hover{background:var(--bg)}
.file-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-date{font-size:11px;color:var(--text-sub);margin-top:2px}
.file-download{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:.2s;flex-shrink:0}
.file-download:hover{background:var(--primary-light)}
.empty-section{padding:20px 18px;color:var(--text-sub);font-size:13px;text-align:center}
.empty-notice{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;text-align:center}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.empty-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--text-sub);line-height:1.7}
.loading{text-align:center;padding:48px;color:var(--text-sub);font-size:14px}
/* 로그인 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;overflow:hidden}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.modal-body{padding:20px}
.login-tab{display:flex;gap:4px;margin-bottom:18px;background:var(--bg);padding:4px;border-radius:10px}
.login-tab button{flex:1;padding:8px;border:none;background:none;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text-sub);font-family:inherit}
.login-tab button.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary-light)}
.btn-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
footer{background:var(--primary);color:rgba(255,255,255,.65);text-align:center;padding:20px;font-size:12px;margin-top:48px}
footer strong{color:#fff}
/* ── Q&A 게시판 ── */
.qna-section{margin-top:28px}
/* 게시판 헤더 */
.qna-board-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0;flex-wrap:wrap;gap:10px}
.qna-board-title{font-size:17px;font-weight:700;color:var(--text)}
.qna-tab-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.qna-tab{padding:8px 18px;border:none;background:none;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text-sub);border-right:1px solid var(--border)}
.qna-tab:last-child{border-right:none}
.qna-tab.active{background:var(--primary);color:#fff;font-weight:700}
.qna-write-btn{padding:9px 18px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.qna-write-btn:hover{background:var(--primary-light)}
/* 테이블 */
.qna-board-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px;box-shadow:var(--shadow)}
.qna-board-table thead tr{background:var(--primary);color:#fff}
.qna-board-table th{padding:11px 12px;font-size:13px;font-weight:600;text-align:center;white-space:nowrap}
.qna-board-table th.col-title{text-align:left}
.qna-board-table td{padding:12px 12px;font-size:13px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
.qna-board-table td.col-title{text-align:left;max-width:0}
.qna-board-table tbody tr.qna-row{cursor:pointer;transition:.12s}
.qna-board-table tbody tr.qna-row:hover td{background:#F7F9FC}
.qna-board-table tbody tr.qna-row.open td{background:#EFF3FB}
.qna-board-table tbody tr:last-child td{border-bottom:none}
.col-num{width:52px;color:var(--text-sub)}
.col-status{width:90px}
.col-ans{width:50px}
.col-author{width:70px;color:var(--text-sub)}
.col-date{width:72px;color:var(--text-sub)}
/* 제목 셀 */
.qna-title-cell{display:flex;align-items:center;gap:8px;min-width:0}
.qna-title-text{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.qna-file-icon{color:var(--text-sub);font-size:13px;flex-shrink:0}
.qna-ans-count{display:inline-block;background:#EBF8FF;color:#2B6CB0;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;flex-shrink:0}
/* 상태 배지 */
.badge-wait{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#FFF3E0;color:#E65100;border:1px solid #FFB74D;white-space:nowrap}
.badge-done{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#E8F5E9;color:#2E7D32;border:1px solid #81C784;white-space:nowrap}
/* 상세 펼침 행 */
.qna-detail-row td{padding:0;border-bottom:1px solid var(--border)}
.qna-detail-row:last-child td{border-bottom:none}
.qna-detail-box{padding:20px 24px;background:#F8FAFF;border-top:2px solid var(--primary)}
.qna-detail-meta{font-size:12px;color:var(--text-sub);margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.qna-detail-content{font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word;padding-bottom:14px;border-bottom:1px solid var(--border)}
.qna-detail-file{margin-top:10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.qna-detail-file a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--primary);text-decoration:none}
.qna-detail-file a:hover{text-decoration:underline}
.qna-admin-bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.qna-admin-btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:#fff;font-family:inherit;color:var(--text-sub)}
.qna-admin-btn:hover{background:var(--bg)}
.qna-admin-btn.danger{border-color:#FC8181;color:#C53030}
.qna-admin-btn.success{border-color:#68D391;color:#276749}
/* 답변 */
.qna-answers-wrap{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.qna-answer-item{background:#fff;border-radius:8px;padding:14px 18px;border-left:3px solid var(--primary-light);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.qna-answer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qna-answer-author{font-size:12px;font-weight:700;color:var(--primary)}
.qna-answer-date{font-size:11px;color:var(--text-sub)}
.qna-answer-content{font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.qna-answer-file{margin-top:8px}
.qna-answer-file a{font-size:12px;color:var(--primary);text-decoration:none}
.qna-answer-file a:hover{text-decoration:underline}
/* 답변 입력 폼 */
.qna-reply-form{margin-top:16px;padding:16px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.qna-reply-form label{display:block;font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px}
.qna-reply-form textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:70px;outline:none;box-sizing:border-box}
.qna-reply-form textarea:focus{border-color:var(--primary-light)}
.qna-reply-actions{display:flex;justify-content:flex-end;margin-top:8px}
.qna-reply-submit{padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.qna-board-empty{text-align:center;padding:40px 0;color:var(--text-sub);font-size:14px}
.qna-board-loading{text-align:center;padding:32px 0;color:var(--text-sub);font-size:13px}
/* 자료실 구분 */
.file-section-divider{display:flex;align-items:center;gap:0;margin:40px 0 0;border-top:3px solid var(--primary)}
.file-section-label{background:var(--primary);color:#fff;padding:8px 24px;font-size:14px;font-weight:700;border-radius:0 0 10px 0;display:inline-block}
/* Q&A 작성 모달 */
.qna-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;align-items:center;justify-content:center;padding:16px}
.qna-modal-overlay.open{display:flex}
.qna-modal{background:#fff;border-radius:16px;width:100%;max-width:520px;overflow:hidden;max-height:90vh;overflow-y:auto}
.qna-modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.qna-modal-title{font-size:16px;font-weight:700}
.qna-modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.qna-modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.qna-form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.qna-form-group input,.qna-form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.qna-form-group input:focus,.qna-form-group textarea:focus{border-color:var(--primary-light)}
.qna-form-group textarea{resize:vertical;min-height:110px}
.qna-file-label{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed var(--border);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-sub);transition:.15s}
.qna-file-label:hover{border-color:var(--primary-light);color:var(--primary)}
.qna-file-name{font-size:12px;color:var(--primary);margin-top:6px}
.qna-modal-submit{padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.qna-modal-submit:disabled{opacity:.6;cursor:not-allowed}
/* ── 2단 레이아웃 (좌: Q&A+자료실 / 우: 소위원회+안내사항) ── */
.practice-layout{max-width:1240px;margin:0 auto;padding:28px 16px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
@media(max-width:960px){.practice-layout{grid-template-columns:1fr}}
.practice-left{min-width:0}
.practice-right{min-width:0;display:flex;flex-direction:column;gap:24px}
/* 우측 사이드 패널 (소위원회 시트 / 안내사항 메모창) */
.side-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.side-panel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;background:var(--primary);color:#fff}
.side-panel-title{font-size:14px;font-weight:700;white-space:nowrap}
.side-panel-add{padding:6px 12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.side-panel-add:hover{background:rgba(255,255,255,.28)}
.committee-scroll{max-height:380px;overflow-y:auto}
.committee-table{width:100%;border-collapse:collapse;font-size:12px}
.committee-table thead th{position:sticky;top:0;background:#F4F6FA;padding:9px 6px;font-size:11px;font-weight:700;color:var(--text-sub);border-bottom:1px solid var(--border);text-align:center;z-index:1}
.committee-table td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:center;color:var(--text);word-break:break-word}
.committee-table tbody tr:last-child td{border-bottom:none}
.committee-table tbody tr:hover td{background:#F7F9FC}
.side-panel-empty{padding:28px 16px;text-align:center;color:var(--text-sub);font-size:13px}
.side-row-btn{background:none;border:none;cursor:pointer;color:var(--text-sub);font-size:13px;padding:2px 4px;line-height:1}
.side-row-btn:hover{color:#C53030}
.notice-list{max-height:380px;overflow-y:auto;padding:8px 18px}
.notice-item{padding:12px 0;border-bottom:1px solid var(--border)}
.notice-item:last-child{border-bottom:none}
.notice-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.notice-item-meta{font-size:11px;color:var(--text-sub);white-space:nowrap}
.notice-item-content{font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}
/* 소위원회 / 안내사항 작성 모달 (Q&A 모달 스타일 재사용) */
.side-form-group{margin-bottom:14px}
.side-form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.side-form-group input,.side-form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.side-form-group input:focus,.side-form-group textarea:focus{border-color:var(--primary-light)}
.side-form-group textarea{resize:vertical;min-height:90px}
.side-form-row{display:flex;gap:10px}
.side-form-row .side-form-group{flex:1}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">삼일<br>공고</div>
    <div class="nav-title">취업정보 포털<span>SAMIL JOBS</span></div>
  </div>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <div class="nav-menu" id="navMenu">
    <a href="index.html">홈</a>
    <a href="jobs.html">채용공고</a>
    <a href="stats.html">취업현황</a>
    <a href="practice.html" class="active">현장실습</a>
    <span id="nav-auth">
      <a href="#" class="nav-login" onclick="openLogin();closeMenu();return false">로그인</a>
    </span>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-inner">
    <h1>🏭 현장실습</h1>
    <p>Q&amp;A 질문 및 단계별 자료를 확인하세요.</p>
  </div>
</div>

<!-- 2단 레이아웃: 좌(Q&A + 자료실) / 우(소위원회 + 안내사항) -->
<div class="practice-layout" id="practiceLayout" style="display:none">
  <div class="practice-left">
    <!-- Q&A 게시판 섹션 -->
    <div class="qna-section" id="qnaSection">
      <!-- 헤더 행: 제목 + 탭 + 글쓰기 -->
      <div class="qna-board-top">
        <div class="qna-board-title">💬 현장실습 Q&amp;A</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="qna-tab-group">
            <button class="qna-tab active" onclick="setQnaTab('all',this)">전체질문</button>
            <button class="qna-tab" onclick="setQnaTab('wait',this)">진행중 Q&amp;A</button>
            <button class="qna-tab" onclick="setQnaTab('done',this)">완료된 Q&amp;A</button>
          </div>
          <button class="qna-write-btn" id="qnaWriteBtn" onclick="openQnaForm()" style="display:none">✏️ 글쓰기</button>
        </div>
      </div>
      <!-- 게시판 테이블 -->
      <table class="qna-board-table" id="qnaBoardTable">
        <thead>
          <tr>
            <th class="col-num">번호</th>
            <th class="col-status">상태</th>
            <th class="col-title">제목</th>
            <th class="col-ans">답변</th>
            <th class="col-author">작성자</th>
            <th class="col-date">날짜</th>
          </tr>
        </thead>
        <tbody id="qnaList"><tr><td colspan="6" class="qna-board-loading">Q&amp;A를 불러오는 중...</td></tr></tbody>
      </table>
    </div>

    <!-- 자료실 구분선 + 자료실 섹션 -->

<div class="modal-overlay" id="loginModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div style="font-size:17px;font-weight:700">로그인</div>
      <button class="modal-close" onclick="document.getElementById('loginModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="login-tab">
        <button class="active" onclick="switchTab('tc',this)">담임교사</button>
        <button onclick="switchTab('ad',this)">관리자</button>
      </div>
      <div id="tab-tc">
        <!-- 담임 / 비담임 서브탭 -->
        <div style="display:flex;gap:4px;background:#f4f6fa;padding:4px;border-radius:10px;margin-bottom:14px">
          <button id="pr-sub-home" onclick="switchPrSub('home')"
            style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;background:#fff;color:#1A3A6B;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:.2s">
            🏠 담임교사
          </button>
          <button id="pr-sub-nh" onclick="switchPrSub('nh')"
            style="flex:1;padding:7px;border:none;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;background:none;color:#5A6A7E;font-weight:500;transition:.2s">
            👤 비담임교사
          </button>
        </div>
        <!-- 담임교사 필드 -->
        <div id="pr-fields-home">
          <div class="form-group"><label>학과</label><select id="l-dept"><option value="">선택</option></select></div>
          <div style="display:flex;gap:8px">
            <div class="form-group" style="flex:1"><label>학년</label><select id="l-grade" onchange="updateCls()"><option value="">학년</option><option>1</option><option>2</option><option>3</option></select></div>
            <div class="form-group" style="flex:1"><label>반</label><select id="l-cls"><option value="">반</option></select></div>
          </div>
          <div class="form-group"><label>이름</label><input id="l-name" placeholder="홍길동" onkeydown="if(event.key==='Enter')doLogin()"></div>
          <div class="form-group"><label>비밀번호</label><input type="password" id="l-pw" onkeydown="if(event.key==='Enter')doLogin()"></div>
        </div>
        <!-- 비담임교사 필드 -->
        <div id="pr-fields-nh" style="display:none">
          <div class="form-group"><label>이름</label><input id="nh-l-name" placeholder="홍길동" onkeydown="if(event.key==='Enter')doLogin()"></div>
          <div class="form-group"><label>비밀번호</label><input type="password" id="nh-l-pw" onkeydown="if(event.key==='Enter')doLogin()"></div>
        </div>
        <button class="btn-submit" onclick="doLogin()">로그인</button>
      </div>
      <div id="tab-ad" style="display:none">
        <div class="form-group"><label>관리자 비밀번호</label><input type="password" id="a-pw" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
        <button class="btn-submit" onclick="doAdminLogin()">로그인</button>
      </div>
    </div>
  </div>
</div>

<script>
let _classes = [];

function isLoggedIn() { return SAMIL_AUTH.isLoggedIn(); }
function isTeacher()  { return SAMIL_AUTH.isAdmin() || SAMIL_AUTH.isTeacher(); }
function isAdmin()    { return SAMIL_AUTH.isAdmin(); }
function getMyName()  {
  const me = SAMIL_AUTH.getME();
  if (me.role === 'admin') return '관리자';
  return me.name || '교사';
}

function getFileIcon(name) {
  if (!name) return '📄';
  const ext = (name.split('.').pop()||'').toLowerCase();
  return {hwp:'📝',docx:'📝',doc:'📝',xlsx:'📊',xls:'📊',pdf:'📕',pptx:'📊',zip:'📦',jpg:'🖼',png:'🖼'}[ext] || '📄';
}

const _PRACTICE_CACHE_KEY = 'samilPracticeCache';
const _PRACTICE_CACHE_TTL = 10 * 60 * 1000; // 10분

function _saveCache(sections, allFiles) {
  try {
    localStorage.setItem(_PRACTICE_CACHE_KEY, JSON.stringify({ sections, allFiles, ts: Date.now() }));
  } catch(_) {}
}

function _loadCache() {
  try {
    const raw = localStorage.getItem(_PRACTICE_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (Date.now() - c.ts > _PRACTICE_CACHE_TTL) return null;
    return c;
  } catch(_) { return null; }
}

function _renderContent(sections, allFiles) {
  const el = document.getElementById('mainContent');
  if (!sections.length) {
    el.innerHTML = `<div class="empty-notice">
      <div class="empty-icon">📂</div>
      <div class="empty-title">탑재된 자료가 없습니다</div>
      <div class="empty-sub">현재 등록된 현장실습 자료가 없습니다.<br>관리자에게 문의하거나 나중에 다시 확인해주세요.</div>
    </div>`;
    return;
  }
  el.innerHTML = sections.map(sec => {
    const files = allFiles.filter(f => f.secId === sec.id).sort((a,b) => a.order - b.order);
    const fileHtml = files.length ? files.map(f => `
      <div class="file-item">
        <span class="file-icon">${getFileIcon(f.name)}</span>
        <div class="file-info">
          <div class="file-name">${f.name}</div>
          <div class="file-date">${(f.date||'').substring(0,10)}</div>
        </div>
        <a class="file-download" href="${f.url}" target="_blank">⬇ 다운로드</a>
      </div>`).join('')
    : `<div class="empty-section">탑재된 자료가 없습니다.</div>`;
    return `<div class="section-block" id="secBlock_${sec.id}">
      <div class="section-divider" onclick="toggleSecBlock('${sec.id}')">
        <div class="section-divider-line"></div>
        <div class="section-divider-title">${sec.title} <span class="section-divider-arrow">▼</span></div>
        <div class="section-divider-line"></div>
      </div>
      <div class="file-list">${fileHtml}</div>
    </div>`;
  }).join('');
}

function toggleSecBlock(secId) {
  const el = document.getElementById('secBlock_' + secId);
  if (el) el.classList.toggle('collapsed');
}

function toggleQnaSection() {
  const sec = document.getElementById('qnaSection');
  if (sec) sec.classList.toggle('collapsed');
}

async function render() {
  updateNavAuth();

  const gate   = document.getElementById('gateContent');
  const layout = document.getElementById('practiceLayout');
  const mainEl = document.getElementById('mainContent');

  if (!isLoggedIn()) {
    gate.innerHTML = `<div class="login-gate">
      <h3>🔐 로그인이 필요합니다</h3>
      <p>현장실습 자료실 및 Q&A는 담임교사 또는 관리자 로그인 후 이용할 수 있습니다.</p>
      <button class="login-gate-btn" onclick="openLogin()">로그인하기</button>
    </div>`;
    layout.style.display = 'none';
    return;
  }

  gate.innerHTML = '';
  layout.style.display = 'grid';

  // ① 캐시 즉시 표시
  const cached = _loadCache();
  if (cached) {
    _renderContent(cached.sections, cached.allFiles);
  } else {
    mainEl.innerHTML = '<div class="loading">자료를 불러오는 중...</div>';
  }

  // ② 백그라운드 최신 데이터 fetch
  let sections = [], allFiles = [];
  try {
    const [secRes, fileRes] = await Promise.all([
      SAMIL_API.getPracticeSections(),
      SAMIL_API.getPracticeFiles(''),
    ]);
    sections = secRes.success ? secRes.data : (cached?.sections || []);
    allFiles = fileRes.success ? fileRes.data : (cached?.allFiles || []);
  } catch(e) {
    if (!cached) {
      mainEl.innerHTML = `<div class="empty-notice">
        <div class="empty-icon">📂</div>
        <div class="empty-title">자료를 불러올 수 없습니다</div>
        <div class="empty-sub">네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>
        <button onclick="render()" style="margin-top:16px;padding:9px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit">다시 시도</button>
      </div>`;
    }
    return;
  }

  _saveCache(sections, allFiles);
  _renderContent(sections, allFiles);
}

// ── 로그인 ──
function openLogin() { document.getElementById('loginModal').classList.add('open'); loadDepts(); }
function closeModal(e) { if (e.target.id==='loginModal') document.getElementById('loginModal').classList.remove('open'); }

function switchTab(tab, btn) {
  ['tc','ad'].forEach(t => document.getElementById('tab-'+t).style.display = t===tab?'block':'none');
  document.querySelectorAll('.login-tab button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

let _prSubMode = 'home';
function switchPrSub(mode) {
  _prSubMode = mode;
  const isHome = mode === 'home';
  document.getElementById('pr-fields-home').style.display = isHome ? '' : 'none';
  document.getElementById('pr-fields-nh').style.display   = isHome ? 'none' : '';
  const bh=document.getElementById('pr-sub-home'), bn=document.getElementById('pr-sub-nh');
  if(bh){bh.style.background=isHome?'#fff':'none';bh.style.color=isHome?'#1A3A6B':'#5A6A7E';bh.style.fontWeight=isHome?'700':'500';bh.style.boxShadow=isHome?'0 1px 4px rgba(0,0,0,.1)':'none';}
  if(bn){bn.style.background=isHome?'none':'#fff';bn.style.color=isHome?'#5A6A7E':'#1A3A6B';bn.style.fontWeight=isHome?'500':'700';bn.style.boxShadow=isHome?'none':'0 1px 4px rgba(0,0,0,.1)';}
}

async function loadDepts() {
  const sel = document.getElementById('l-dept');
  if (sel.options.length > 1) return;
  try {
    const [res, cRes] = await Promise.all([SAMIL_API.getDepts(), SAMIL_API.getClasses({ year: new Date().getFullYear() })]);
    (res.data||[]).forEach(d => { const o=document.createElement('option'); o.value=o.textContent=d.name||d; sel.appendChild(o); });
    _classes = cRes.success ? cRes.data : [];
  } catch(_) {}
}

function updateCls() {
  const dept  = document.getElementById('l-dept').value;
  const grade = document.getElementById('l-grade').value;
  const sel   = document.getElementById('l-cls');
  sel.innerHTML = '<option value="">반</option>';
  if (!dept||!grade) return;
  const nums = _classes.filter(c=>c.dept===dept&&String(c.grade)===String(grade)).map(c=>Number(c.num||c.cls)).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  nums.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
}

async function doLogin() {
  const btn=document.querySelector('#tab-tc .btn-submit');
  if(btn){btn.textContent='확인중…';btn.disabled=true;}
  let res;
  if(_prSubMode==='nh'){
    const name=document.getElementById('nh-l-name').value.trim();
    const pw=document.getElementById('nh-l-pw').value;
    if(!name||!pw){alert('이름과 비밀번호를 입력하세요');if(btn){btn.textContent='로그인';btn.disabled=false;}return;}
    res=await SAMIL_API.loginNonHomeTeacher(name,pw);
  } else {
    const dept=document.getElementById('l-dept').value;
    const grade=document.getElementById('l-grade').value;
    const cls=document.getElementById('l-cls').value;
    const name=document.getElementById('l-name').value.trim();
    const pw=document.getElementById('l-pw').value;
    if(!dept||!grade||!cls||!name||!pw){alert('모든 항목을 입력하세요');if(btn){btn.textContent='로그인';btn.disabled=false;}return;}
    res=await SAMIL_API.loginTeacher(dept,grade,cls,name,pw);
  }
  if(btn){btn.textContent='로그인';btn.disabled=false;}
  if(res.success){
    SAMIL_AUTH.setTeacher(res.teacher);
    document.getElementById('loginModal').classList.remove('open');
    render(); renderQnaSection(); loadQnAs();
    renderCommitteeSection(); loadCommittee();
    renderNoticeSection(); loadNotices();
  } else {
    const pwEl=_prSubMode==='nh'?document.getElementById('nh-l-pw'):document.getElementById('l-pw');
    if(pwEl)pwEl.value='';
    alert(res.error||'로그인 실패');
  }
}

async function doAdminLogin() {
  const pw=document.getElementById('a-pw').value;
  const res=await SAMIL_API.verifyAdminPw(pw);
  if(res.success){
    SAMIL_AUTH.setAdmin();
    document.getElementById('loginModal').classList.remove('open');
    render(); renderQnaSection(); loadQnAs();
    renderCommitteeSection(); loadCommittee();
    renderNoticeSection(); loadNotices();
  } else { document.getElementById('a-pw').value=''; alert('비밀번호가 맞지 않습니다'); }
}

function doLogout() {
  SAMIL_AUTH.logout();
  updateNavAuth(); render(); renderQnaSection();
  renderCommitteeSection(); renderNoticeSection();
}

function updateNavAuth() {
  const el=document.getElementById('nav-auth');
  if(SAMIL_AUTH.isAdmin()){
    el.innerHTML=`<a href="admin.html" class="nav-login" style="background:#38A169!important">관리자 페이지</a><a href="#" onclick="doLogout();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">로그아웃</a>`;
  } else if(SAMIL_AUTH.isTeacher()){
    const label=SAMIL_AUTH.getDisplayName();
    el.innerHTML=`<a href="teacher.html" class="nav-login" style="background:#38A169!important">${label}</a><a href="#" onclick="doLogout();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">로그아웃</a>`;
  } else {
    el.innerHTML=`<a href="#" class="nav-login" onclick="openLogin();closeMenu();return false">로그인</a>`;
  }
}

function toggleMenu(){ document.getElementById('navMenu').classList.toggle('open'); }
function closeMenu(){ document.getElementById('navMenu').classList.remove('open'); }

// ── Q&A 게시판 ──────────────────────────────────
let _qnaAll      = [];   // 전체 원본 데이터
let _qnaTab      = 'all'; // 현재 탭: all | wait | done
let _qnaFileData = null;  // 첨부 파일 {name, base64, mimeType}
let _qnaOpenId   = null;  // 현재 열린 행 id

const _QNA_CACHE_KEY = 'samilQnaCache';
const _QNA_CACHE_TTL = 5 * 60 * 1000; // 5분

function _qnaSaveCache(data) {
  try { localStorage.setItem(_QNA_CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); } catch(_) {}
}
function _qnaLoadCache() {
  try {
    const raw = localStorage.getItem(_QNA_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (Date.now() - c.ts > _QNA_CACHE_TTL) return null;
    return c.data;
  } catch(_) { return null; }
}

function renderQnaSection() {
  if (!isLoggedIn()) return;
  const writeBtn = document.getElementById('qnaWriteBtn');
  if (writeBtn) writeBtn.style.display = isTeacher() ? '' : 'none';
}

// ── 현장실습소위원회 관리 ──────────────────────
let _committeeAll = [];

function renderCommitteeSection() {
  if (!isLoggedIn()) return;
  const addBtn = document.getElementById('committeeAddBtn');
  const head   = document.getElementById('committeeActionsHead');
  if (addBtn) addBtn.style.display = isAdmin() ? '' : 'none';
  if (head)   head.style.display   = isAdmin() ? '' : 'none';
}

async function loadCommittee() {
  if (!isLoggedIn()) return;
  try {
    const r = await SAMIL_API.getCommittee();
    _committeeAll = r.success ? (r.data || []) : [];
  } catch(_) { _committeeAll = []; }
  renderCommittee();
}

function renderCommittee() {
  const tbody = document.getElementById('committeeList');
  if (!tbody) return;
  const cols = isAdmin() ? 6 : 5;
  if (!_committeeAll.length) {
    tbody.innerHTML = `<tr><td colspan="${cols}" class="side-panel-empty">등록된 항목이 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = _committeeAll.map((c, idx) => `
    <tr>
      <td>${_committeeAll.length - idx}</td>
      <td>${escHtml(c.dept)}</td>
      <td>${escHtml((c.date||'').substring(0,10))}</td>
      <td>${escHtml(c.refNo)}</td>
      <td>${escHtml(c.note)}</td>
      ${isAdmin() ? `<td><button class="side-row-btn" onclick="deleteCommitteeRow('${c.id}')" title="삭제">🗑</button></td>` : ''}
    </tr>`).join('');
}

function openCommitteeForm() {
  if (!isAdmin()) return;
  document.getElementById('committeeModal').classList.add('open');
}

function closeCommitteeModal() {
  document.getElementById('committeeModal').classList.remove('open');
  ['cm-dept','cm-date','cm-refno','cm-note'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
}

async function submitCommittee() {
  const dept  = document.getElementById('cm-dept').value.trim();
  const date  = document.getElementById('cm-date').value;
  const refNo = document.getElementById('cm-refno').value.trim();
  const note  = document.getElementById('cm-note').value.trim();
  if (!dept || !date) { alert('학과와 일자를 입력하세요'); return; }
  const r = await SAMIL_API.addCommittee({ dept, date, refNo, note });
  if (r.success) { closeCommitteeModal(); await loadCommittee(); }
  else alert(r.error || '등록 실패');
}

async function deleteCommitteeRow(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  const r = await SAMIL_API.deleteCommittee(id);
  if (r.success) await loadCommittee();
  else alert(r.error || '삭제 실패');
}

// ── 현장실습 안내사항 메모창 ────────────────────
let _noticeAll = [];

function renderNoticeSection() {
  if (!isLoggedIn()) return;
  const addBtn = document.getElementById('noticeAddBtn');
  if (addBtn) addBtn.style.display = isAdmin() ? '' : 'none';
}

async function loadNotices() {
  if (!isLoggedIn()) return;
  try {
    const r = await SAMIL_API.getNotices();
    _noticeAll = r.success ? (r.data || []) : [];
  } catch(_) { _noticeAll = []; }
  renderNotices();
}

function renderNotices() {
  const list = document.getElementById('noticeList');
  if (!list) return;
  if (!_noticeAll.length) { list.innerHTML = `<div class="side-panel-empty">등록된 안내사항이 없습니다.</div>`; return; }
  list.innerHTML = _noticeAll.map(n => `
    <div class="notice-item">
      <div class="notice-item-top">
        <span class="notice-item-meta">${escHtml(n.author||'')} · ${(n.date||'').substring(0,10)}</span>
        ${isAdmin() ? `<button class="side-row-btn" onclick="deleteNoticeItem('${n.id}')" title="삭제">🗑</button>` : ''}
      </div>
      <div class="notice-item-content">${escHtml(n.content)}</div>
    </div>`).join('');
}

function openNoticeForm() {
  if (!isAdmin()) return;
  document.getElementById('noticeModal').classList.add('open');
}

function closeNoticeModal() {
  document.getElementById('noticeModal').classList.remove('open');
  const el = document.getElementById('nt-content'); if (el) el.value = '';
}

async function submitNotice() {
  const content = document.getElementById('nt-content').value.trim();
  if (!content) { alert('내용을 입력하세요'); return; }
  let myName = '관리자';
  try { myName = getMyName(); } catch(_) {}
  const r = await SAMIL_API.addNotice({ content, author: myName });
  if (r.success) { closeNoticeModal(); await loadNotices(); }
  else alert(r.error || '등록 실패');
}

async function deleteNoticeItem(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  const r = await SAMIL_API.deleteNotice(id);
  if (r.success) await loadNotices();
  else alert(r.error || '삭제 실패');
}

async function loadQnAs() {
  if (!isLoggedIn()) return;

  // ① 캐시 즉시 표시
  const cached = _qnaLoadCache();
  if (cached) {
    _qnaAll = cached;
    renderQnas();
  } else {
    document.getElementById('qnaList').innerHTML = '<tr><td colspan="6" class="qna-board-loading">Q&amp;A를 불러오는 중...</td></tr>';
  }

  // ② 백그라운드 최신 데이터 fetch
  try {
    const r = await SAMIL_API.getQnAs();
    if (r.success) {
      _qnaAll = r.data || [];
      _qnaSaveCache(_qnaAll);
      renderQnas();
    }
  } catch(_) {
    if (!cached) { _qnaAll = []; renderQnas(); }
  }
}

function setQnaTab(tab, btn) {
  _qnaTab = tab;
  _qnaOpenId = null;
  document.querySelectorAll('.qna-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderQnas();
}

function renderQnas() {
  const questions = _qnaAll.filter(d => d.type === 'question');
  let filtered = questions;
  if (_qnaTab === 'wait') filtered = questions.filter(q => q.status !== '답변완료' && !_qnaAll.some(d=>d.type==='answer'&&d.parentId===q.id));
  if (_qnaTab === 'done') filtered = questions.filter(q => q.status === '답변완료' || _qnaAll.some(d=>d.type==='answer'&&d.parentId===q.id));

  const tbody = document.getElementById('qnaList');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="qna-board-empty">등록된 Q&amp;A가 없습니다.</td></tr>`;
    return;
  }
  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  let rows = '';
  filtered.forEach((q, idx) => {
    const answers = _qnaAll.filter(d => d.type === 'answer' && d.parentId === q.id);
    const answered = q.status === '답변완료' || answers.length > 0;
    const badge = answered
      ? '<span class="badge-done">답변완료</span>'
      : '<span class="badge-wait">진행중</span>';
    const fileIcon = q.fileUrl ? '<span class="qna-file-icon" title="첨부파일 있음">📎</span>' : '';
    const ansCnt = answers.length ? `<span class="qna-ans-count">${answers.length}</span>` : '';
    const dateStr = (q.date||'').substring(0,10).replace(/-/g,'.').substring(2);
    rows += `<tr class="qna-row${_qnaOpenId===q.id?' open':''}" onclick="toggleQna('${q.id}')">
      <td class="col-num">${filtered.length - idx}</td>
      <td class="col-status">${badge}</td>
      <td class="col-title"><div class="qna-title-cell">${fileIcon}<span class="qna-title-text">${escHtml(q.title||q.content||'')}</span>${ansCnt}</div></td>
      <td class="col-ans" style="color:var(--text-sub)">${answers.length}</td>
      <td class="col-author">${escHtml(q.author||'')}</td>
      <td class="col-date">${dateStr}</td>
    </tr>`;
    // 펼침 상세 행
    if (_qnaOpenId === q.id) {
      const adminBar = isAdmin() ? `<div class="qna-admin-bar">
        ${!answered ? `<button class="qna-admin-btn success" onclick="qnaMarkAnswered('${q.id}',event)">✅ 답변완료 처리</button>` : ''}
        <button class="qna-admin-btn danger" onclick="qnaDelete('${q.id}','',event)">🗑 질문 삭제</button>
      </div>` : '';
      const fileRow = q.fileUrl ? `<div class="qna-detail-file">📎 <a href="${q.fileUrl}" target="_blank">${escHtml(q.fileName||'첨부파일')}</a></div>` : '';
      const ansHtml = answers.map(a => {
        const aAdminBtn = isAdmin() ? `<button class="qna-admin-btn danger" onclick="qnaDelete('${a.id}','${q.id}',event)" style="font-size:11px;padding:3px 8px">🗑 삭제</button>` : '';
        const aFile = a.fileUrl ? `<div class="qna-answer-file">📎 <a href="${a.fileUrl}" target="_blank">${escHtml(a.fileName||'첨부파일')}</a></div>` : '';
        return `<div class="qna-answer-item">
          <div class="qna-answer-top">
            <span class="qna-answer-author">💬 ${escHtml(a.author||'교사')}</span>
            <div style="display:flex;align-items:center;gap:8px"><span class="qna-answer-date">${(a.date||'').substring(0,10)}</span>${aAdminBtn}</div>
          </div>
          <div class="qna-answer-content">${escHtml(a.content||'')}</div>
          ${aFile}
        </div>`;
      }).join('');
      const replyForm = isLoggedIn() ? `<div class="qna-reply-form">
        <label>✏️ 답변 작성</label>
        <textarea id="ansText_${q.id}" placeholder="답변 내용을 입력하세요..."></textarea>
        <div class="qna-reply-actions"><button class="qna-reply-submit" onclick="submitAnswer('${q.id}')">답변 등록</button></div>
      </div>` : '';
      rows += `<tr class="qna-detail-row"><td colspan="6"><div class="qna-detail-box">
        <div class="qna-detail-meta"><span>작성자: ${escHtml(q.author||'')}</span><span>날짜: ${(q.date||'').substring(0,10)}</span></div>
        <div class="qna-detail-content">${escHtml(q.content||'')}</div>
        ${fileRow}${adminBar}
        <div class="qna-answers-wrap">${ansHtml}</div>
        ${replyForm}
      </div></td></tr>`;
    }
  });
  tbody.innerHTML = rows;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleQna(id) {
  _qnaOpenId = (_qnaOpenId === id) ? null : id;
  renderQnas();
}

async function submitAnswer(qId) {
  const ta = document.getElementById('ansText_'+qId);
  if (!ta || !ta.value.trim()) { alert('답변 내용을 입력하세요'); return; }
  const btn = ta.nextElementSibling ? ta.nextElementSibling.querySelector('button') || ta.nextElementSibling : null;
  if (btn) { btn.disabled = true; btn.textContent = '등록 중...'; }
  let myName = '교사';
  try { myName = getMyName(); } catch(_) {}
  try {
    const r = await SAMIL_API.addQnAAnswer({ parentId: qId, content: ta.value.trim(), author: myName });
    if (r.success) { ta.value = ''; try { localStorage.removeItem(_QNA_CACHE_KEY); } catch(_){} await loadQnAs(); _qnaOpenId = qId; renderQnas(); }
    else { alert(r.error || '등록 실패'); if (btn) { btn.disabled = false; btn.textContent = '답변 등록'; } }
  } catch(e) { console.error('submitAnswer error:', e); alert('오류: ' + (e.message||String(e))); if (btn) { btn.disabled = false; btn.textContent = '답변 등록'; } }
}

async function qnaDelete(id, parentId, e) {
  e.stopPropagation();
  if (!confirm('삭제하시겠습니까?')) return;
  const r = await SAMIL_API.deleteQnA(id);
  if (r.success) { try { localStorage.removeItem(_QNA_CACHE_KEY); } catch(_){} await loadQnAs(); }
  else alert(r.error || '삭제 실패');
}

async function qnaMarkAnswered(id, e) {
  e.stopPropagation();
  const r = await SAMIL_API.markAnswered(id);
  if (r.success) { try { localStorage.removeItem(_QNA_CACHE_KEY); } catch(_){} await loadQnAs(); }
  else alert(r.error || '처리 실패');
}

// Q&A 작성 모달
function openQnaForm() {
  if (!isTeacher()) { alert('교사 로그인 후 이용할 수 있습니다'); return; }
  document.getElementById('qnaModal').classList.add('open');
}
function closeQnaModal() {
  document.getElementById('qnaModal').classList.remove('open');
  _qnaFileData = null;
  document.getElementById('qf-file-name').textContent = '';
  document.getElementById('qf-title').value = '';
  document.getElementById('qf-content').value = '';
  document.getElementById('qf-file').value = '';
}

function onQnaFileSelect(input) {
  const file = input.files[0];
  if (!file) { _qnaFileData = null; document.getElementById('qf-file-name').textContent = ''; return; }
  if (file.size > 10 * 1024 * 1024) { alert('10MB 이하 파일만 첨부 가능합니다'); input.value = ''; return; }
  document.getElementById('qf-file-name').textContent = '📎 ' + file.name;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const b64 = ev.target.result.split(',')[1];
    _qnaFileData = { name: file.name, base64: b64, mimeType: file.type || 'application/octet-stream' };
  };
  reader.readAsDataURL(file);
}

async function submitQna() {
  const title   = document.getElementById('qf-title').value.trim();
  const content = document.getElementById('qf-content').value.trim();
  if (!title || !content) { alert('제목과 내용을 입력하세요'); return; }
  const btn = document.getElementById('qf-submit');
  btn.disabled = true; btn.textContent = '등록 중...';

  // ① 이름 안전 취득
  let myName = '교사';
  try { myName = getMyName(); } catch(e0) { console.warn('getMyName 오류:', e0); }

  try {
    let fileUrl = '', fileName = '';
    if (_qnaFileData) {
      const fr = await SAMIL_API.uploadQnAFile(_qnaFileData.name, _qnaFileData.base64, _qnaFileData.mimeType);
      if (fr.success) { fileUrl = fr.url; fileName = fr.name; }
      else { alert('파일 업로드 실패: ' + (fr.error||'')); btn.disabled = false; btn.textContent = '등록하기'; return; }
    }
    // ② API 호출
    let r;
    try {
      r = await SAMIL_API.addQnA({ title, content, author: myName, fileUrl, fileName });
    } catch(eApi) {
      console.error('addQnA API 오류:', eApi);
      alert('API 오류: ' + (eApi.message || String(eApi)));
      btn.disabled = false; btn.textContent = '등록하기';
      return;
    }
    if (r.success) {
      try { localStorage.removeItem(_QNA_CACHE_KEY); } catch(_) {}
      closeQnaModal();
      try { await loadQnAs(); } catch(eLoad) { console.warn('loadQnAs 오류:', eLoad); }
    } else {
      alert(r.error || '등록 실패');
    }
  } catch(e) {
    console.error('submitQna 전체 오류:', e);
    alert('오류: ' + (e.message || String(e)));
  }
  btn.disabled = false; btn.textContent = '등록하기';
}

window.addEventListener('DOMContentLoaded', () => {
  SAMIL_AUTH.restore();  // 기존 세션 키 → 통합 형식으로 정규화
  if (typeof SAMIL_API.ping === "function") SAMIL_API.ping();
  renderQnaSection();        // 섹션 가시성 먼저
  renderCommitteeSection();
  renderNoticeSection();
  render();                  // 자료실 내용 로드
  if (isLoggedIn()) { loadQnAs(); loadCommittee(); loadNotices(); }
});
