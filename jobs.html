<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용공고 — 삼일공업고등학교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1A3A6B;--primary-light:#2E5FAD;--accent:#E8740A;--accent-light:#FF9E3A;
  --bg:#F4F6FA;--card:#fff;--text:#1C2B3A;--text-sub:#5A6A7E;--border:#DDE3EE;
  --nav-h:60px;--radius:12px;--shadow:0 2px 12px rgba(26,58,107,.10)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding-top:var(--nav-h)}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--primary);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.nav-title{color:#fff;font-weight:700;font-size:16px}
.nav-title span{color:rgba(255,255,255,.65);font-size:10px;display:block;font-weight:400}
.nav-menu{display:flex;gap:4px;align-items:center}
.nav-menu a{color:rgba(255,255,255,.8);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}
.nav-menu a:hover,.nav-menu a.active{background:rgba(255,255,255,.15);color:#fff}
.nav-login{background:var(--accent) !important;color:#fff !important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{width:22px;height:2px;background:#fff;border-radius:2px}
@media(max-width:768px){
  .nav-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:var(--primary);flex-direction:column;padding:12px}
  .nav-menu.open{display:flex}
  .nav-menu a{padding:12px 16px}
  .hamburger{display:flex}
}
/* 페이지 탭 */
.page-header{background:var(--primary);padding:0 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.page-tabs{display:flex;gap:0;max-width:1100px;margin:0 auto}
.page-tab{padding:14px 24px;color:rgba(255,255,255,.65);font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.page-tab.active{color:#fff;border-bottom-color:var(--accent-light)}
/* 공통 */
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.section-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px;display:block}
/* 공고 */
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.job-filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.job-filter-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text-sub);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.job-filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.job-filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.job-search{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;outline:none;min-width:180px}
.job-search:focus{border-color:var(--primary-light)}
.job-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;border:1px solid var(--border)}
.job-card:hover{transform:translateY(-2px);border-color:var(--primary-light)}
.job-company{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.job-recommend{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.job-title{font-size:12px;color:var(--text-sub);font-weight:400;margin-bottom:8px}
.job-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.job-tag{background:var(--bg);color:var(--text-sub);font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
.job-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.job-stats{display:flex;gap:14px;padding-top:8px;border-top:1px solid var(--border);margin-top:8px}
.job-stat{font-size:11px;color:var(--text-sub);display:flex;align-items:center;gap:3px}
.job-deadline{font-size:12px;color:var(--text-sub)}
.job-deadline.urgent{color:#E53E3E;font-weight:600}
.job-detail{font-size:12px;color:var(--primary-light);font-weight:600}
.btn-more{display:block;width:100%;text-align:center;padding:11px;border:2px solid var(--border);border-radius:var(--radius);color:var(--text-sub);font-size:14px;cursor:pointer;background:#fff;margin-bottom:28px;transition:.2s}
.btn-more:hover{border-color:var(--primary);color:var(--primary)}
/* 아카이브 */
.archive-filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.archive-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;outline:none;background:#fff;cursor:pointer}
.archive-select:focus{border-color:var(--primary-light)}
.archive-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-공공기관{background:#EBF8FF;color:#2B6CB0}
.badge-대기업{background:#F0FFF4;color:#276749}
.badge-중소기업{background:#FFF5F5;color:#C53030}
.badge-공무원{background:#FAF5FF;color:#6B46C1}
.badge-기타{background:#F7FAFC;color:#4A5568}
/* 기업카드 아코디언 */
.co-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.co-card-header{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.co-card-header:hover{background:var(--bg)}
.co-card-name{font-size:16px;font-weight:700;flex:1}
.co-card-count{font-size:12px;color:var(--text-sub)}
.co-card-arrow{font-size:13px;color:var(--text-sub);transition:.2s}
.co-card-arrow.open{transform:rotate(90deg)}
.co-card-body{display:none;border-top:1px solid var(--border)}
.co-card-body.open{display:block}
.alumni-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.alumni-row:last-child{border-bottom:none}
.alumni-row:hover{background:var(--bg)}
.alumni-name{font-size:13px;font-weight:600;min-width:60px}
.alumni-meta{font-size:12px;color:var(--text-sub);flex:1}
.alumni-certs{font-size:11px;color:var(--text-sub);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.alumni-btn{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;color:var(--primary-light);font-weight:600}
.alumni-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.login-gate{background:var(--card);border-radius:var(--radius);padding:48px 24px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.login-gate h3{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)}
.login-gate p{font-size:13px;color:var(--text-sub);margin-bottom:20px}
.login-gate-btn{padding:11px 28px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.modal-body{padding:18px}
.modal-company{font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px}
.modal-title{font-size:12px;color:var(--text-sub);font-weight:400;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info-item{background:var(--bg);border-radius:8px;padding:10px 12px}
.info-label{font-size:11px;color:var(--text-sub);margin-bottom:2px}
.info-value{font-size:14px;font-weight:600}
.recommend-box{background:#FFF3E0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.modal-desc{font-size:14px;line-height:1.75;white-space:pre-line}
.apply-btn{display:block;background:var(--primary);color:#fff;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;flex:2}
.btn-interest{flex:1;padding:13px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-sub);transition:.2s}
.btn-interest.on{border-color:var(--accent);color:var(--accent);background:#FFF3E0}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--text)}
.file-item:hover{background:var(--border)}
.sub-table{width:100%;border-collapse:collapse;font-size:13px}
.sub-table th{background:var(--bg);padding:7px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.sub-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.sub-table tr:last-child td{border-bottom:none}
.sub-check{width:16px;height:16px;cursor:pointer}
.sub-badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
.sub-badge.담임{background:#EBF8FF;color:#2B6CB0}
.sub-badge.학생{background:#F0FFF4;color:#276749}
/* 로그인 모달 */
.login-modal{max-width:380px}
.login-tab{display:flex;gap:4px;margin-bottom:18px;background:var(--bg);padding:4px;border-radius:10px}
.login-tab button{flex:1;padding:8px;border:none;background:none;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text-sub);font-family:inherit}
.login-tab button.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary-light)}
.btn-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
footer{background:var(--primary);color:rgba(255,255,255,.65);text-align:center;padding:20px;font-size:12px}
footer strong{color:#fff}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo" style="font-size:10px;line-height:1.2">삼일<br>공고</div>
    <div class="nav-title">취업정보 포털<span>SAMIL JOBS</span></div>
  </div>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <div class="nav-menu" id="navMenu">
    <a href="index.html">홈</a>
    <a href="jobs.html" class="active">채용공고</a>
    <a href="stats.html">취업현황</a>
    <a href="practice.html">현장실습</a>
    <span id="nav-auth">
      <a href="#" class="nav-login" onclick="openLogin();closeMenu();return false">로그인</a>
    </span>
  </div>
</nav>

<!-- 페이지 탭 -->
<div class="page-header">
  <div class="page-tabs">
    <div class="page-tab active" id="ptab-jobs" onclick="switchPageTab('jobs')">📋 채용공고</div>
    <div class="page-tab" id="ptab-archive" onclick="switchPageTab('archive')">🏆 선배 아카이브</div>
  </div>
</div>

<!-- ── 채용공고 탭 ── -->
<div id="panel-jobs" class="container">
  <div class="job-filter-bar">
    <button class="job-filter-btn active" data-f="전체"    onclick="setFilter('전체')">전체</button>
    <button class="job-filter-btn"        data-f="마감임박" onclick="setFilter('마감임박')">마감임박</button>
    <button class="job-filter-btn"        data-f="진행중"  onclick="setFilter('진행중')">진행중</button>
    <button class="job-filter-btn"        data-f="마감"    onclick="setFilter('마감')">마감</button>
    <input class="job-search" id="jobSearch" placeholder="회사명 / 직무 검색" oninput="renderJobs()">
  </div>
  <div class="jobs-grid" id="jobList"></div>
  <button class="btn-more" id="btnMore" onclick="loadMore()">공고 더 보기</button>
</div>

<!-- ── 선배 아카이브 탭 ── -->
<div id="panel-archive" class="container" style="display:none">
  <div id="archiveGate"></div>
</div>

<!-- 공고 상세 모달 -->
<div class="modal-overlay" id="jobModal" onclick="closeModal('jobModal',event)">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-company" id="m-co"></div><div class="modal-title" id="m-title"></div></div>
      <button class="modal-close" onclick="closeModal('jobModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="info-grid">
        <div class="info-item"><div class="info-label">공고제목</div><div class="info-value" id="m-job"></div></div>
        <div class="info-item"><div class="info-label">근무지</div><div class="info-value" id="m-loc"></div></div>
        <div class="info-item"><div class="info-label">모집인원</div><div class="info-value" id="m-cnt"></div></div>
        <div class="info-item"><div class="info-label">마감일</div><div class="info-value" id="m-dl"></div></div>
      </div>
      <div id="m-rec" style="display:none" class="recommend-box">🏫 <strong>학교장 추천전형</strong> — 추천 인원: <span id="m-reccnt"></span></div>
      <div class="modal-desc" id="m-desc"></div>
      <div id="m-files" style="display:none;margin-top:14px">
        <div style="font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px">📎 붙임파일</div>
        <div id="m-file-list"></div>
      </div>
      <div id="modal-action-btns" style="display:flex;gap:10px;margin-top:16px"></div>
    </div>
  </div>
</div>

<!-- 서브모달 -->
<div class="modal-overlay" id="subModal" onclick="closeModal('subModal',event)">
  <div class="modal" style="max-width:540px">
    <div class="modal-header">
      <div style="font-size:16px;font-weight:700" id="sub-title"></div>
      <button class="modal-close" onclick="closeModal('subModal')">✕</button>
    </div>
    <div class="modal-body" id="sub-body" style="max-height:55vh;overflow-y:auto;padding-top:4px"></div>
    <div id="sub-footer" style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"></div>
  </div>
</div>

<!-- 아카이브 상세 모달 -->
<div class="modal-overlay" id="archiveModal" onclick="closeModal('archiveModal',event)">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-company" id="ar-co"></div><div class="modal-title" id="ar-meta"></div></div>
      <button class="modal-close" onclick="closeModal('archiveModal')">✕</button>
    </div>
    <div class="modal-body">
      <div id="ar-essays" style="margin-bottom:14px"></div>
      <div id="ar-review" style="font-size:14px;line-height:1.75;color:var(--text)"></div>
    </div>
  </div>
</div>

<!-- 로그인 모달 -->
<div class="modal-overlay" id="loginModal" onclick="closeModal('loginModal',event)">
  <div class="modal login-modal">
    <div class="modal-header">
      <div style="font-size:17px;font-weight:700">로그인</div>
      <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="login-tab">
        <button class="active" onclick="switchLoginTab('st',this)">학생</button>
        <button onclick="switchLoginTab('tc',this)">담임교사</button>
        <button onclick="switchLoginTab('ad',this)">관리자</button>
      </div>
      <div id="tab-st">
        <div class="form-group"><label>학과</label><select id="l-dept"><option value="">선택</option></select></div>
        <div class="form-group"><label>학번</label><input id="l-id" placeholder="예: 3104" onkeydown="if(event.key==='Enter')loginStudent()"></div>
        <div class="form-group"><label>비밀번호</label><input type="password" id="l-pw" placeholder="초기: 생년월일 6자리" onkeydown="if(event.key==='Enter')loginStudent()"></div>
        <button class="btn-submit" onclick="loginStudent()">로그인</button>
      </div>
      <div id="tab-tc" style="display:none">
        <div class="form-group"><label>학과</label><select id="t-dept" onchange="updateTcCls()" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px"><option value="">학과 선택</option></select></div>
        <div style="display:flex;gap:8px">
          <div class="form-group" style="flex:1"><label>학년</label><select id="t-grade" onchange="updateTcCls()" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px"><option value="">학년</option><option>1</option><option>2</option><option>3</option></select></div>
          <div class="form-group" style="flex:1"><label>반</label><select id="t-cls" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px"><option value="">반</option></select></div>
        </div>
        <div class="form-group"><label>이름</label><input id="t-name" placeholder="홍길동" onkeydown="if(event.key==='Enter')loginTeacher()"></div>
        <div class="form-group"><label>비밀번호</label><input type="password" id="t-pw" onkeydown="if(event.key==='Enter')loginTeacher()"></div>
        <button class="btn-submit" onclick="loginTeacher()">로그인</button>
      </div>
      <div id="tab-ad" style="display:none">
        <div class="form-group"><label>관리자 비밀번호</label><input type="password" id="a-pw" onkeydown="if(event.key==='Enter')tryAdmin()"></div>
        <button class="btn-submit" onclick="tryAdmin()">로그인</button>
      </div>
    </div>
  </div>
</div>

<footer><strong>삼일공업고등학교</strong> 특성화취창업지원부 | 경기도 수원시</footer>

<script>
// ── 전역 데이터 ──
let DATA = { jobs:[], statsMap:{}, classes:[] };
let showN = 12;
let currentFilter = '전체';
let ARCHIVE_DATA = [];
let archiveFilter = { dept:'', type:'', year:'' };

// ── 페이지 탭 전환 ──
function switchPageTab(tab){
  ['jobs','archive'].forEach(t=>{
    document.getElementById('panel-'+t).style.display = t===tab ? 'block' : 'none';
    document.getElementById('ptab-'+t).classList.toggle('active', t===tab);
  });
  if(tab==='archive') initArchiveTab();
}

// ── 초기화 ──
window.addEventListener('DOMContentLoaded', async ()=>{
  updateNavAuth();

  // 캐시 우선 렌더
  try{
    const cd = JSON.parse(localStorage.getItem('samilJobsCache')||'{}');
    if(cd.jobs){ DATA.jobs = cd.jobs; renderJobs(); }
  }catch(_){}

  const [jobsSet, jobStatsSet, classesSet, deptsSet] = await Promise.allSettled([
    SAMIL_API.getJobs(false),
    SAMIL_API.getJobStats(),
    SAMIL_API.getClasses({ year: new Date().getFullYear() }),
    SAMIL_API.getDepts(),
  ]);

  const jobsRes     = jobsSet.status     === 'fulfilled' ? jobsSet.value     : {};
  const jobStatsRes = jobStatsSet.status === 'fulfilled' ? jobStatsSet.value : {};
  const classesRes  = classesSet.status  === 'fulfilled' ? classesSet.value  : {};
  const deptsRes    = deptsSet.status    === 'fulfilled' ? deptsSet.value    : {};

  DATA.classes = classesRes.success && classesRes.data ? classesRes.data : [];

  if(jobStatsRes.success){
    const {interest={}, apply={}} = jobStatsRes;
    const allIds = new Set([...Object.keys(interest), ...Object.keys(apply)]);
    allIds.forEach(id => { DATA.statsMap[id] = { interest: interest[id]||0, apply: apply[id]||0 }; });
  }

  DATA.jobs = jobsRes.success ? jobsRes.data : [];
  renderJobs();

  // 학과 드롭다운
  const depts = deptsRes.success && deptsRes.data && deptsRes.data.length ? deptsRes.data : [];
  const selS = document.getElementById('l-dept');
  depts.forEach(d=>{
    const o = document.createElement('option');
    o.value = d.name||d.dept; o.textContent = d.name||d.dept; selS.appendChild(o);
  });

  try{ localStorage.setItem('samilJobsCache', JSON.stringify({jobs:DATA.jobs})); }catch(_){}
});

// ── 공고 필터/렌더 ──
function getTodayStr(){
  const t=new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.job-filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  showN = 12; renderJobs();
}

function getFilteredJobs(){
  const todayStr = getTodayStr();
  const q = (document.getElementById('jobSearch')?.value||'').trim().toLowerCase();
  return DATA.jobs.filter(j=>{
    if((j.status||'')==='삭제') return false;
    if(q && !((j.co||'').toLowerCase().includes(q)||(j.job||'').toLowerCase().includes(q))) return false;
    const dl = (j.dl||'').substring(0,10);
    const expired = dl < todayStr;
    const diff = expired ? -1 : Math.ceil((new Date(dl+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
    const urgent = !expired && diff <= 7;
    switch(currentFilter){
      case '전체':    return true;
      case '마감임박': return !expired && !(!j.active) && urgent;
      case '진행중':  return !expired && j.active && !urgent;
      case '마감':    return expired || !j.active;
      default: return true;
    }
  });
}

function renderJobs(){
  const todayStr = getTodayStr();
  const valid = getFilteredJobs();
  if(!valid.length){
    document.getElementById('jobList').innerHTML='<p style="color:var(--text-sub);font-size:13px;padding:12px 0">해당하는 채용공고가 없습니다.</p>';
    document.getElementById('btnMore').style.display='none';
    return;
  }
  const sorted = [...valid].sort((a,b)=>{
    const aExp = (a.dl||'').substring(0,10) < todayStr || !a.active;
    const bExp = (b.dl||'').substring(0,10) < todayStr || !b.active;
    if(aExp !== bExp) return aExp ? 1 : -1;
    const da = new Date((a.dl||'').substring(0,10)+'T00:00:00');
    const db = new Date((b.dl||'').substring(0,10)+'T00:00:00');
    return aExp ? db-da : da-db;
  });
  document.getElementById('jobList').innerHTML = sorted.slice(0,showN).map(j=>{
    const dlStr = (j.dl||'').substring(0,10);
    const diff  = dlStr < todayStr ? -1 : Math.ceil((new Date(dlStr+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
    const urg   = diff >= 0 && diff <= 7;
    const tags  = (j.tags||[]).map(t=>`<span class="job-tag">${t}</span>`).join('');
    const origIdx = DATA.jobs.indexOf(j);
    const jobId = j.id != null ? String(j.id) : String(origIdx);
    const sm = DATA.statsMap[jobId]||{interest:0,apply:0};
    return `<div class="job-card" onclick="openJob(${origIdx})">
      <div class="job-company">${j.type?`[${j.type}] `:''}${j.co||''}${j.rec?'<span class="job-recommend">학교장추천</span>':''}</div>
      <div class="job-title">${j.job||''}</div>
      <div class="job-meta">${tags}${j.loc?`<span class="job-tag">📍${j.loc}</span>`:''}${j.cnt?`<span class="job-tag">👤${j.cnt}</span>`:''}</div>
      <div class="job-footer">
        <span class="job-deadline${urg?' urgent':''}">
          ${diff<0?'마감 '+dlStr:urg?'마감임박 '+dlStr:'<span style="color:#2563eb">진행중</span>&nbsp;&nbsp;'+dlStr}
        </span>
        <span class="job-detail">상세보기 →</span>
      </div>
      <div class="job-stats">
        <span class="job-stat">👁 ${j.views||0}회</span>
        <span class="job-stat">🤍 관심 ${sm.interest}명</span>
        <span class="job-stat">📝 지원 ${sm.apply}명</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('btnMore').style.display = showN >= sorted.length ? 'none' : 'block';
}

function loadMore(){ showN += 6; renderJobs(); }

let _curJobIdx = -1;
function openJob(i){
  _curJobIdx = i;
  const j = DATA.jobs[i];
  document.getElementById('m-co').textContent = (j.type?`[${j.type}] `:'')+( j.co||'');
  document.getElementById('m-title').textContent = j.job||'';
  document.getElementById('m-job').textContent  = j.job||'';
  document.getElementById('m-loc').textContent  = j.loc||'';
  document.getElementById('m-cnt').textContent  = j.cnt||'';
  document.getElementById('m-dl').textContent   = (j.dl||'').substring(0,10);
  document.getElementById('m-desc').textContent = j.desc||'';
  document.getElementById('m-rec').style.display = j.rec ? 'block' : 'none';
  if(j.rec) document.getElementById('m-reccnt').textContent = j.recCnt>0 ? j.recCnt+'명' : '제한없음';
  const fWrap = document.getElementById('m-files');
  const fList = document.getElementById('m-file-list');
  if(j.files&&j.files.length){
    fList.innerHTML = j.files.map(f=>`<a class="file-item" href="${f.url}" target="_blank">📄 ${f.name}</a>`).join('');

  } else fWrap.style.display = 'none';

}

async function renderModalButtons(i){
  const j = DATA.jobs[i];
  const jobId = j.id != null ? String(j.id) : String(i);
  const el = document.getElementById('modal-action-btns');
  const isAdmin   = sessionStorage.getItem('samilAdminAuth') === '1';
  const isTeacher = !!sessionStorage.getItem('samilTeacherAuth');
  const isStudent = !!sessionStorage.getItem('samilStudentAuth');
  if(isAdmin){
    el.innerHTML=`
      <button class="btn-interest" style="flex:1" onclick="openAdminSubModal('interest','${jobId}')">👥 관심학생 조회</button>
      <button class="apply-btn" style="flex:1" onclick="openAdminSubModal('apply','${jobId}')">📋 지원학생 조회</button>`;

async function handleStudentInterest(i, jobId){
  const ME = JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');
  const btn = document.getElementById('btn-interest');
  btn.disabled = true;
  const res = await SAMIL_API.toggleInterest({ jobId, jobName: DATA.jobs[i]?.job||'', studentId: ME.id, name: ME.name, dept: ME.dept, grade: ME.grade, cls: ME.cls });
  if(!res.success){ alert(res.error||'오류'); btn.disabled=false; return; }
  let arr = JSON.parse(localStorage.getItem('interests')||'[]');
  if(res.interested){ arr.push(i); btn.className='btn-interest on'; btn.textContent='❤️ 관심등록됨'; }
  else { arr=arr.filter(x=>x!==i); btn.className='btn-interest'; btn.textContent='🤍 관심등록'; }
  localStorage.setItem('interests', JSON.stringify(arr));
  btn.disabled = false;
}

async function handleStudentApply(jobId){
  const ME = JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');

}

async function submitTeacherApply(jobId, jobName){
  const ME = JSON.parse(sessionStorage.getItem('samilTeacherME')||'{}');
  const checked = [...document.querySelectorAll('.apply-chk:checked:not(:disabled)')];
  if(!checked.length){ alert('지원할 학생을 선택해주세요.'); return; }
  const students = checked.map(c=>({ id:c.value, name:c.dataset.name, dept:c.dataset.dept, grade:c.dataset.grade, cls:c.dataset.cls }));
  const res = await SAMIL_API.applyJobs({ teacherId: ME.id, jobId, jobName, students: JSON.stringify(students) });
  if(res.success) alert(`✅ ${res.added}명 지원 완료 (중복 ${res.skipped}명 제외)`);
  else alert(res.error||'오류');
  closeModal('subModal');
}

function applyArchiveFilter(){
  archiveFilter.dept = document.getElementById('af-dept')?.value||'';
  archiveFilter.type = document.getElementById('af-type')?.value||'';
  archiveFilter.year = document.getElementById('af-year')?.value||'';
  renderArchive();
}

function maskName(name){
  if(!name) return '—';
  if(name.length<=1) return name;
  if(name.length===2) return name[0]+'○';
  return name[0]+'○'+name[name.length-1];
}

function canSeeFullName(){
  return sessionStorage.getItem('samilAdminAuth')==='1' || !!sessionStorage.getItem('samilTeacherAuth');
}

function formatSummary(summary){
  if(!summary) return '';
  try{
    const s = typeof summary === 'string' ? JSON.parse(summary) : summary;
    if(!s || typeof s !== 'object') return summary;
    const parts = [];
    if(s.allUnit)  parts.push(`전체 ${s.allUnit}단위/평균 ${s.allGrade}등급`);
    if(s.proUnit)  parts.push(`전문 ${s.proUnit}단위/${s.proGrade}등급`);
    return parts.join(' · ');
  }catch(e){ return summary||''; }
}

function renderArchive(){
  const list = document.getElementById('archiveList');
  const empty = document.getElementById('archiveEmpty');
  if(!list) return;
  let filtered = ARCHIVE_DATA;
  if(archiveFilter.dept) filtered = filtered.filter(a=>a.dept===archiveFilter.dept);
  if(archiveFilter.type) filtered = filtered.filter(a=>(a.type||'')===archiveFilter.type);
  if(archiveFilter.year) filtered = filtered.filter(a=>String(a.year)===archiveFilter.year);
  if(!filtered.length){
    list.innerHTML=''; if(empty) empty.style.display='block'; return;
  }
  if(empty) empty.style.display='none';
  window._filteredArchive = filtered;

  // 기업별 그룹핑
  const coMap = {};
  filtered.forEach((a,i)=>{
    const key = a.co||'기타';
    if(!coMap[key]) coMap[key]={ type:a.type||'', list:[] };
    coMap[key].list.push({...a, _fi:i});
  });

  const showFull = canSeeFullName();
  list.innerHTML = Object.entries(coMap).map(([co, g])=>{
    const typeClass = 'badge-'+(g.type||'기타').replace(/\s/g,'');
    const alumni = g.list.map(a=>{
      const displayName = showFull ? (a.sname||'—') : maskName(a.sname);
      const certsStr = a.certs ? `<span class="alumni-certs">🎖 ${a.certs}</span>` : '';
      const middleStr = a.middle ? `<span class="alumni-certs">🏫 ${a.middle}</span>` : '';
      return `<div class="alumni-row">
        <span class="alumni-name">${displayName}</span>
        <span class="alumni-meta">${a.dept||''} · ${a.year||''}년 졸업</span>
        ${middleStr}${certsStr}
        <div style="margin-left:auto"><button class="alumni-btn" onclick="openArchiveModal(${a._fi})">상세보기</button></div>
      </div>`;
    }).join('');
    const cardId = 'co-'+co.replace(/\s/g,'_');
    return `<div class="co-card">
      <div class="co-card-header" onclick="toggleCoCard('${cardId}')">
        <span class="archive-badge ${typeClass}">${g.type||'기타'}</span>
        <span class="co-card-name">${co}</span>
        <span class="co-card-count">합격자 ${g.list.length}명</span>
        <span class="co-card-arrow" id="arr-${cardId}">▶</span>
      </div>
      <div class="co-card-body" id="${cardId}">${alumni}</div>
    </div>`;
  }).join('');
}

function toggleCoCard(id){
  const body = document.getElementById(id);
  const arr  = document.getElementById('arr-'+id);
  const isOpen = body.classList.toggle('open');
  arr.classList.toggle('open', isOpen);
}

function openArchiveModal(i){
  const a = window._filteredArchive[i];
  if(!a) return;
  const showFull = canSeeFullName();
  const displayName = showFull ? (a.sname||'—') : maskName(a.sname);
  document.getElementById('ar-co').textContent = a.co||'';
  document.getElementById('ar-meta').textContent = `${a.dept||''} · ${a.year||''}년 졸업 · ${displayName}${a.middle?' · '+a.middle+' 출신':''}`;
  const essaysEl = document.getElementById('ar-essays');
  const validEssays = (a.essays||[]).filter(f => f.url && !f.url.includes('GMT') && f.url.startsWith('http'));
  if(validEssays.length){
    essaysEl.innerHTML=`<div style="font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px">📎 합격자소서</div>`+
      validEssays.map(f=>`<a class="file-item" href="${f.url}" target="_blank">📄 ${f.name}</a>`).join('');
  } else {
    essaysEl.innerHTML=`<div style="font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px">📎 합격자소서</div>`+
      `<p style="font-size:13px;color:var(--text-sub);padding:8px 0">붙임파일 없음</p>`;
  }
  essaysEl.style.display='block';
  const reviewEl = document.getElementById('ar-review');
  const infoLines = [];
  if(a.certs)              infoLines.push(`🎖 자격증: ${a.certs}`);
  if(a.attend)             infoLines.push(`📋 출결: ${a.attend}`);
  if(a.clubs)              infoLines.push(`🎨 동아리: ${a.clubs}`);
  if(a.summary && showFull) infoLines.push(`📊 성적: ${formatSummary(a.summary)}`);
  reviewEl.style.display='block';
  reviewEl.innerHTML=
    (infoLines.length ? `<div style="background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:2">${infoLines.join('<br>')}</div>` : '')+
    `<div style="font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px">💬 합격 후기</div>`+
    (a.review ? `<div style="font-size:14px;line-height:1.8;white-space:pre-line">${a.review}</div>` : `<p style="font-size:13px;color:var(--text-sub)">내용 없음</p>`);
  document.getElementById('archiveModal').classList.add('open');
}

// ── 로그인/공통 ──
function closeModal(id,e){ if(!e||e.target.id===id) document.getElementById(id).classList.remove('open'); }
function openLogin(){ document.getElementById('loginModal').classList.add('open'); }

function updateTcCls(){
  const dept  = document.getElementById('t-dept')?.value||'';
  const grade = document.getElementById('t-grade')?.value||'';
  const sel   = document.getElementById('t-cls');
  if(!sel) return;
  sel.innerHTML = '<option value="">반</option>';
  if(!dept||!grade||!DATA.classes.length) return;
  const nums = DATA.classes.filter(c=>c.dept===dept&&String(c.grade)===String(grade)).map(c=>Number(c.num||c.cls)).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  nums.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  if(nums.length===1) sel.value=nums[0];
}

function switchLoginTab(tab,btn){
  ['st','tc','ad'].forEach(t=>document.getElementById('tab-'+t).style.display='none');
  document.getElementById('tab-'+tab).style.display='block';
  document.querySelectorAll('.login-tab button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='tc') loadTcDepts();
}

async function loadTcDepts(){
  const sel = document.getElementById('t-dept');
  if(sel.options.length>1) return;
  try{
    const res = await SAMIL_API.getDepts();
    const depts = res.success&&res.data.length ? res.data : [];
    depts.forEach(d=>{ const o=document.createElement('option'); o.value=d.name||d.dept; o.textContent=d.name||d.dept; sel.appendChild(o); });
  }catch(e){}
}

async function loginStudent(){
  const dept=document.getElementById('l-dept').value;
  const id=document.getElementById('l-id').value.trim();
  const pw=document.getElementById('l-pw').value;
  if(!dept){alert('학과를 선택하세요');return;}
  if(!id||!pw){alert('학번과 비밀번호를 입력하세요');return;}
  const btn=document.querySelector('#tab-st .btn-submit');
  if(btn){btn.textContent='확인중…';btn.disabled=true;}
  const res=await SAMIL_API.loginStudent(dept,id,pw);
  if(btn){btn.textContent='로그인';btn.disabled=false;}
  if(res.success){
    sessionStorage.setItem('samilStudentAuth',res.student.id);
    sessionStorage.setItem('samilStudentME',JSON.stringify(res.student));
    closeModal('loginModal');
    updateNavAuth();
    // 아카이브 탭 열려있으면 재초기화
    if(document.getElementById('panel-archive').style.display!=='none'){ ARCHIVE_DATA=[]; initArchiveTab(); }
  } else { document.getElementById('l-pw').value=''; alert(res.error||'학과/학번/비밀번호가 일치하지 않습니다.'); }
}

async function loginTeacher(){
  const dept=document.getElementById('t-dept').value;
  const grade=document.getElementById('t-grade').value;
  const cls=document.getElementById('t-cls').value;
  const name=document.getElementById('t-name').value.trim();
  const pw=document.getElementById('t-pw').value;
  if(!dept||!grade||!cls||!name||!pw){alert('모든 항목을 입력하세요');return;}
  const btn=document.querySelector('#tab-tc .btn-submit');
  if(btn){btn.textContent='확인중…';btn.disabled=true;}
  const res=await SAMIL_API.loginTeacher(dept,grade,cls,name,pw);
  if(btn){btn.textContent='로그인';btn.disabled=false;}
  if(res.success){
    sessionStorage.setItem('samilTeacherAuth',res.teacher.id);
    sessionStorage.setItem('samilTeacherME',JSON.stringify(res.teacher));
    closeModal('loginModal');
    updateNavAuth();
    if(document.getElementById('panel-archive').style.display!=='none'){ ARCHIVE_DATA=[]; initArchiveTab(); }
  } else { document.getElementById('t-pw').value=''; alert(res.error||'담임 계정 정보가 맞지 않습니다.'); }
}

function tryAdmin(){
  const pw=document.getElementById('a-pw').value;
  const masterPw=localStorage.getItem('samilMasterPw')||'samil_master';
  const commonPw=localStorage.getItem('samilCommonPw')||'samil2024';
  if(pw===masterPw||pw===commonPw){
    sessionStorage.setItem('samilAdminAuth','1');
    closeModal('loginModal');
    updateNavAuth();
    if(document.getElementById('panel-archive').style.display!=='none'){ ARCHIVE_DATA=[]; initArchiveTab(); }
  } else { document.getElementById('a-pw').value=''; alert('비밀번호가 틀렸습니다.'); }
}

function updateNavAuth(){
  const el=document.getElementById('nav-auth');
  const isAdmin   = sessionStorage.getItem('samilAdminAuth')==='1';
  const isTeacher = !!sessionStorage.getItem('samilTeacherAuth');
  const isStudent = !!sessionStorage.getItem('samilStudentAuth');
  if(isAdmin){
    el.innerHTML=
      `<a href="admin.html" class="nav-login" style="background:#16A34A!important">관리자 페이지</a>`+
      `<a href="#" onclick="openChangeAdminPw();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">🔑 비번변경</a>`+
      `<a href="#" onclick="doLogout();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">로그아웃</a>`;
  } else if(isTeacher){
    const t=JSON.parse(sessionStorage.getItem('samilTeacherME')||'{}');
    el.innerHTML=
      `<a href="teacher.html" class="nav-login" style="background:#16A34A!important">${t.name||'담임'} 선생님</a>`+
      `<a href="#" onclick="doLogout();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">로그아웃</a>`;
  } else if(isStudent){
    const s=JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');
    el.innerHTML=
      `<a href="student.html" class="nav-login" style="background:#16A34A!important">${s.name||'학생'}님</a>`+
      `<a href="#" onclick="doLogout();return false" style="color:rgba(255,255,255,.7);font-size:13px;padding:7px 10px">로그아웃</a>`;
  } else {
    el.innerHTML=`<a href="#" class="nav-login" onclick="openLogin();closeMenu();return false">로그인</a>`;
  }
}

/* ── 관리자 비밀번호 변경 모달 ── */
function openChangeAdminPw(){
  let modal=document.getElementById('jobsChangePwModal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='jobsChangePwModal';
    modal.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:16px';
    modal.innerHTML=`
      <div style="background:#fff;border-radius:16px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.22);overflow:hidden;font-family:Noto Sans KR,sans-serif">
        <div style="padding:18px 20px 14px;border-bottom:1px solid #DDE3EE;display:flex;justify-content:space-between;align-items:center">
          <h3 style="margin:0;font-size:17px;font-weight:700">🔑 관리자 비밀번호 변경</h3>
          <button onclick="closeChangeAdminPw()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#5A6A7E;line-height:1">✕</button>
        </div>
        <div style="padding:20px">
          <div style="margin-bottom:13px"><label style="display:block;font-size:13px;font-weight:500;margin-bottom:5px">현재 비밀번호</label>
            <input id="cpw-cur" type="password" placeholder="현재 비밀번호 입력" style="width:100%;padding:10px 12px;border:1.5px solid #DDE3EE;border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box"></div>
          <div style="margin-bottom:13px"><label style="display:block;font-size:13px;font-weight:500;margin-bottom:5px">새 비밀번호</label>
            <input id="cpw-new" type="password" placeholder="새 비밀번호 (6자 이상)" style="width:100%;padding:10px 12px;border:1.5px solid #DDE3EE;border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box"></div>
          <div style="margin-bottom:13px"><label style="display:block;font-size:13px;font-weight:500;margin-bottom:5px">새 비밀번호 확인</label>
            <input id="cpw-cfm" type="password" placeholder="새 비밀번호 다시 입력" style="width:100%;padding:10px 12px;border:1.5px solid #DDE3EE;border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box"
              onkeydown="if(event.key==='Enter')submitChangeAdminPw()"></div>
          <div id="cpw-err" style="color:#DC2626;font-size:13px;min-height:18px;margin-bottom:8px"></div>
          <button id="cpw-btn" onclick="submitChangeAdminPw()" style="width:100%;padding:12px;background:#1A3A6B;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">비밀번호 변경</button>
          <div id="cpw-ok" style="display:none;text-align:center;color:#16A34A;font-size:14px;font-weight:600;padding:10px 0">✅ 비밀번호가 성공적으로 변경되었습니다.</div>
        </div>
      </div>`;
    document.body.appendChild(modal);
  }
  ['cpw-cur','cpw-new','cpw-cfm'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('cpw-err').textContent='';
  document.getElementById('cpw-ok').style.display='none';
  document.getElementById('cpw-btn').style.display='';
  modal.style.display='flex';
}

function closeChangeAdminPw(){
  const m=document.getElementById('jobsChangePwModal'); if(m) m.style.display='none';
}

async function submitChangeAdminPw(){
  const cur=(document.getElementById('cpw-cur')||{}).value||'';
  const nw =(document.getElementById('cpw-new')||{}).value||'';
  const cfm=(document.getElementById('cpw-cfm')||{}).value||'';
  const err=document.getElementById('cpw-err');
  const btn=document.getElementById('cpw-btn');
  err.textContent='';
  if(!cur){err.textContent='현재 비밀번호를 입력하세요.';return;}
  if(!nw){err.textContent='새 비밀번호를 입력하세요.';return;}
  if(nw.length<6){err.textContent='비밀번호는 6자 이상이어야 합니다.';return;}
  if(nw!==cfm){err.textContent='새 비밀번호가 일치하지 않습니다.';return;}
  if(cur===nw){err.textContent='현재 비밀번호와 동일합니다.';return;}
  btn.disabled=true; btn.textContent='변경 중...';
  try{
    const res=await SAMIL_API.changeAdminPw(cur,nw);
    if(res&&res.success){
      sessionStorage.setItem('samilAdminToken',nw);
      btn.style.display='none';
      document.getElementById('cpw-ok').style.display='';
      setTimeout(closeChangeAdminPw,2000);
    } else {
      err.textContent=res?.error||'현재 비밀번호가 맞지 않거나 오류가 발생했습니다.';
      btn.disabled=false; btn.textContent='비밀번호 변경';
      const c=document.getElementById('cpw-cur'); if(c) c.value='';
    }
  }catch(e){err.textContent='오류가 발생했습니다. 다시 시도해주세요.'; btn.disabled=false; btn.textContent='비밀번호 변경';}
}

function doLogout(){
  ['samilAdminAuth','samilAdminToken','samilTeacherAuth','samilTeacherME','samilStudentAuth','samilStudentME','statsMe'].forEach(k=>sessionStorage.removeItem(k));
  updateNavAuth();
  // 아카이브 탭이면 로그인 게이트로 복귀
  if(document.getElementById('panel-archive').style.display!=='none'){ ARCHIVE_DATA=[]; initArchiveTab(); }
}

function toggleMenu(){ document.getElementById('navMenu').classList.toggle('open'); }
function closeMenu(){ document.getElementById('navMenu').classList.remove('open'); }
</script>
