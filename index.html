<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼일공업고등학교 취업정보 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1A3A6B;--primary-light:#2E5FAD;--accent:#E8740A;--accent-light:#FF9E3A;
  --bg:#F4F6FA;--card:#fff;--text:#1C2B3A;--text-sub:#5A6A7E;--border:#DDE3EE;
  --nav-h:60px;--radius:12px;--shadow:0 2px 12px rgba(26,58,107,.10)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding-top:var(--nav-h)}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--primary);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.nav-title{color:#fff;font-weight:700;font-size:16px}
.nav-title span{color:rgba(255,255,255,.65);font-size:10px;display:block;font-weight:400}
.nav-menu{display:flex;gap:4px;align-items:center}
.nav-menu a{color:rgba(255,255,255,.8);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}
.nav-menu a:hover,.nav-menu a.active{background:rgba(255,255,255,.15);color:#fff}
.nav-login{background:var(--accent) !important;color:#fff !important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{width:22px;height:2px;background:#fff;border-radius:2px}
@media(max-width:768px){
  .nav-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:var(--primary);flex-direction:column;padding:12px}
  .nav-menu.open{display:flex}
  .nav-menu a{padding:12px 16px}
  .hamburger{display:flex}
}
.hero{background:var(--primary);padding:40px 24px 36px;color:#fff;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:12px;margin-bottom:16px}
.hero h1{font-size:28px;font-weight:700;margin-bottom:4px;line-height:1.3}
.hero h1 span{color:var(--accent-light);display:block}
.hero p{font-size:13px;opacity:.7;margin-bottom:28px}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:860px;margin:0 auto}
.stat-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px 8px;text-align:center}
.stat-icon{font-size:20px;margin-bottom:4px}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:10px;color:rgba(255,255,255,.7);margin-top:3px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(3,1fr)}.stat-card:nth-child(4),.stat-card:nth-child(5){display:none}}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.section-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px;display:block}
.banner-slider{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
.banner-slider::-webkit-scrollbar{display:none}
.banner-item{flex:0 0 280px;border-radius:10px;padding:18px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;min-height:90px;transition:.2s}
.banner-item:hover{transform:translateY(-2px)}
.banner-title{font-size:14px;font-weight:600}
.banner-date{font-size:11px;opacity:.75;margin-top:4px}
.banner-arrow{text-align:right;font-size:16px;margin-top:8px}
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.job-filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.job-filter-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text-sub);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.job-filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.job-filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.job-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;border:1px solid var(--border)}
.job-card:hover{transform:translateY(-2px);border-color:var(--primary-light)}
.job-company{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.job-recommend{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.job-title{font-size:12px;color:var(--text-sub);font-weight:400;margin-bottom:8px}
.job-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.job-tag{background:var(--bg);color:var(--text-sub);font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
.job-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.job-stats{display:flex;gap:14px;padding-top:8px;border-top:1px solid var(--border);margin-top:8px}
.job-stat{font-size:11px;color:var(--text-sub);display:flex;align-items:center;gap:3px}
.job-deadline{font-size:12px;color:var(--text-sub)}
.job-deadline.urgent{color:#E53E3E;font-weight:600}
.job-detail{font-size:12px;color:var(--primary-light);font-weight:600}
.btn-more{display:block;width:100%;text-align:center;padding:11px;border:2px solid var(--border);border-radius:var(--radius);color:var(--text-sub);font-size:14px;cursor:pointer;background:#fff;margin-bottom:28px;transition:.2s}
.btn-more:hover{border-color:var(--primary);color:var(--primary)}
.sub-table{width:100%;border-collapse:collapse;font-size:13px}
.sub-table th{background:var(--bg);padding:7px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.sub-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.sub-table tr:last-child td{border-bottom:none}
.sub-check{width:16px;height:16px;cursor:pointer}
.sub-badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
.sub-badge.담임{background:#EBF8FF;color:#2B6CB0}
.sub-badge.학생{background:#F0FFF4;color:#276749}
.dept-table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:32px}
.dept-table{width:100%;border-collapse:collapse}
.dept-table th{background:var(--primary);color:#fff;padding:11px 14px;font-size:13px;text-align:center}
.dept-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);text-align:center}
.dept-table tr:last-child td{border-bottom:none}
.dept-table tr:hover td{background:var(--bg)}
.dept-rate{font-weight:700;color:var(--primary)}
.dept-total td{background:var(--bg);font-weight:700}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.modal-body{padding:18px}
.modal-company{font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px}
.modal-title{font-size:12px;color:var(--text-sub);font-weight:400;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info-item{background:var(--bg);border-radius:8px;padding:10px 12px}
.info-label{font-size:11px;color:var(--text-sub);margin-bottom:2px}
.info-value{font-size:14px;font-weight:600}
.recommend-box{background:#FFF3E0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.modal-desc{font-size:14px;line-height:1.75;white-space:pre-line}
.apply-btn{display:block;background:var(--primary);color:#fff;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;flex:2}
.btn-interest{flex:1;padding:13px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-sub);transition:.2s}
.btn-interest.on{border-color:var(--accent);color:var(--accent);background:#FFF3E0}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--text)}
.file-item:hover{background:var(--border)}
/* 로그인 모달 CSS → samil-login.js 로 이동 */
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary-light)}
.btn-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
footer{background:var(--primary);color:rgba(255,255,255,.65);text-align:center;padding:20px;font-size:12px}
footer strong{color:#fff}
</style>

<script>
// ── 데이터 로드 (localStorage 우선, 없으면 샘플) ──
const SAMPLE = {
  stats:{grad:'—',rate:'—',active:'—',closing:'—',done:'—'},
  banners:[],
  jobs:[],
  depts:[]
};

function loadData(){
  const DB = JSON.parse(localStorage.getItem('samilAdmin')||'{}');
  return {
    jobs:   (DB.jobs||[]).length   ? DB.jobs.filter(j=>j.active)   : SAMPLE.jobs,
    banners:(DB.banners||[]).length ? DB.banners                    : SAMPLE.banners,
    depts:  (DB.employ||DB.employs||[]).length ? buildDeptStats(DB) : SAMPLE.depts,
    stats:  buildStats(DB)
  };
}

function buildStats(DB){
  const jobs=(DB.jobs||[]);
  const today=new Date();
  const active=jobs.filter(j=>j.active).length;
  const closing=jobs.filter(j=>{
    if(!j.active) return false;
    const d=new Date(j.dl); const diff=Math.ceil((d-today)/86400000);
    return diff>=0&&diff<=7;
  }).length;
  const done=jobs.filter(j=>!j.active).length;
  // 취업현황 통계
  const employs=DB.employ||DB.employs||[];
  const latestYear=employs.length?Math.max(...employs.map(e=>e.year)):null;
  const yearData=latestYear?employs.filter(e=>e.year==latestYear):[];
  const totalGrad=yearData.reduce((a,e)=>a+(e.grad||0),0)||312;
  const totalEmp =yearData.reduce((a,e)=>a+(e.emp||0),0)||244;
  return {
    grad:totalGrad+'명',
    rate:totalGrad?Math.round(totalEmp/totalGrad*100)+'%':'78%',
    active:active||'8개',
    closing:closing||'3개',
    done:done||'24개'
  };
}

function buildDeptStats(DB){
  const employ = DB.employ || DB.employs || [];
  if(!employ.length) return SAMPLE.depts;
  const latestYear=Math.max(...employ.map(e=>e.year));
  return employ.filter(e=>e.year==latestYear).map(e=>({
    dept:e.dept, g:e.grad||0, e:e.emp||0, a:e.adv||0
  }));
}

let showN = 6;
let currentFilter = '전체';

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.job-filter-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.f === f));
  showN = 6;
  renderJobs();
}

function getTodayStr(){
  const t=new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function getFilteredJobs(){
  const todayStr = getTodayStr();
  return DATA.jobs.filter(j=>{
    if((j.status||'') === '삭제') return false;
    const dl = (j.dl||'').substring(0,10);
    const expired = dl < todayStr;
    const inactive = !j.active;
    const diff = expired ? -1 : Math.ceil((new Date(dl+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
    const urgent = !expired && diff <= 7;
    switch(currentFilter){
      case '전체':    return true;           // 삭제 제외 전체
      case '마감임박': return !expired && !inactive && urgent;
      case '진행중':  return !expired && !inactive && !urgent;
      case '마감':    return expired || inactive;
      default: return true;
    }
  });
}
let DATA = {jobs:[],banners:[],depts:[],stats:{},statsMap:{}};

window.addEventListener('DOMContentLoaded', async ()=>{
  if (typeof SAMIL_API.ping === 'function') SAMIL_API.ping();
  // updateNavAuth() → samil-login.js 가 자동 처리
  // ── 캐시 우선 즉시 렌더 ──
  const cached = localStorage.getItem('samilJobsCache');
  if(cached){
    try{
      const cd = JSON.parse(cached);
      DATA.jobs    = cd.jobs    || [];
      DATA.banners = cd.banners || [];
      DATA.stats   = cd.stats   || DATA.stats;
      // ★ employ 캐시도 즉시 복원 → renderDeptTable 지연 제거
      if (cd.employ && cd.employ.length) {
        DATA.depts = buildDeptStats({ employ: cd.employ });
      }
      renderJobs();
      renderBanners();
      renderDeptTable();
      // 통계 카드도 캐시에서 즉시 표시
      if (cd.stats) {
        const s = cd.stats;
        if (s.grad)    document.getElementById('s-grad').textContent    = s.grad;
        if (s.rate)    document.getElementById('s-rate').textContent    = s.rate;
        if (s.active)  document.getElementById('s-active').textContent  = s.active;
        if (s.closing) document.getElementById('s-closing').textContent = s.closing;
        if (s.done)    document.getElementById('s-done').textContent    = s.done;
      }
    }catch(_){}
  }

  // ── Sheets에서 데이터 로드 (getAll 1회 호출로 cold start 최소화) ──
  const all = await SAMIL_API.getAll(new Date().getFullYear()).catch(() => null);
  const jobsRes     = all && all.success ? { success: true, data: all.jobs    || [] } : {};
  const bannersRes  = all && all.success ? { success: true, data: all.banners || [] } : {};
  const statsRes    = all && all.success ? { success: true, latest: all.latest, data: all.stats } : {};
  const deptsRes    = all && all.success ? { success: true, data: all.depts   || [] } : {};
  const jobStatsRes = all && all.success ? { success: true, ...all.jobStats } : {};
  const classesRes  = all && all.success ? { success: true, data: all.classes || [] } : {};
  DATA.classes = (classesRes.success && classesRes.data) ? classesRes.data : [];
  if(jobStatsRes.success){
    const {interest={}, apply={}} = jobStatsRes;
    const allIds = new Set([...Object.keys(interest), ...Object.keys(apply)]);
    allIds.forEach(id => { DATA.statsMap[id] = { interest: interest[id]||0, apply: apply[id]||0 }; });
  }

  DATA.jobs    = jobsRes.success    ? jobsRes.data    : SAMPLE.jobs;
  DATA.banners = bannersRes.success ? bannersRes.data : SAMPLE.banners;

  // 학과별 취업현황
  // getAll은 현재연도(2026) employ를 반환 → 데이터가 전년도(2025)에 있으면 빈 배열
  // → 빈 경우 전년도까지 순서대로 추가 시도
  let employData = (all && all.success && all.employ) ? all.employ : [];
  if (!employData.length) {
    const curYear = new Date().getFullYear();
    // 전년도, 전전년도 순으로 데이터 탐색 (최대 2년 전까지)
    for (let y = curYear - 1; y >= curYear - 2; y--) {
      const r = await SAMIL_API.getEmployStats(y).catch(() => null);
      if (r && r.success && r.data && r.data.length) {
        employData = r.data;
        break;
      }
    }
  }
  if (employData.length) {
    const DB_adm = JSON.parse(localStorage.getItem('samilAdmin')||'{}');
    DB_adm.employ = employData;
    try { localStorage.setItem('samilAdmin', JSON.stringify(DB_adm)); } catch(_) {}
    DATA.depts = buildDeptStats({ employ: employData });
  } else {
    // 최후 fallback: localStorage (관리자 컴퓨터에서만 유효)
    const DB_adm = JSON.parse(localStorage.getItem('samilAdmin')||'{}');
    DATA.depts = buildDeptStats(DB_adm);
  }
  renderDeptTable();

  // 통계
  const st = statsRes.success && statsRes.latest ? statsRes.latest : {};
  const today2 = new Date();
  const todayStr2 = getTodayStr();
  const thisYear = today2.getFullYear();
  const closing = DATA.jobs.filter(j=>{
    const diff=Math.ceil((new Date(j.dl)-today2)/86400000);
    return diff>=0&&diff<=7;
  }).length;
  const done = DATA.jobs.filter(j=>{
    const dl=(j.dl||'').substring(0,10);
    const expired = dl < todayStr2;
    return (expired || !j.active) && dl.startsWith(thisYear);
  }).length;
  DATA.stats = {
    grad    : st.grad     ? st.grad+'명'    : SAMPLE.stats.grad,
    rate    : st.rate     ? st.rate+'%'     : SAMPLE.stats.rate,
    active  : DATA.jobs.filter(j=>{ const dl=(j.dl||'').substring(0,10); return j.active && dl >= todayStr2; }).length+'개',
    closing : closing+'개',
    done    : done+'개',
  };

  // 학과 드롭다운 — samil-login.js의 _loadStDepts()가 lazy 로딩으로 처리함
  // ★ 버그수정: all.depts는 학과명 목록으로, 취업통계로 채워진 DATA.depts를 덮어쓰면 안 됨
  //   DATA.depts가 비어 있을 때만 학과명으로 초기화 (취업통계 없는 경우 fallback)
  if (!DATA.depts.length && deptsRes.success && deptsRes.data && deptsRes.data.length) {
    DATA.depts = deptsRes.data.map(d=>({dept:d.name||d.dept,g:0,e:0,a:0}));
    renderDeptTable();
  }

  // ── 캐시 저장 및 재렌더 ──
  // ★ employ도 캐시에 저장 → 다음 방문 시 즉시 표 렌더링
  const employToCache = (all && all.success && all.employ) ? all.employ : [];
  try{ localStorage.setItem('samilJobsCache', JSON.stringify({jobs:DATA.jobs, banners:DATA.banners, stats:DATA.stats, employ:employToCache})); }catch(_){}
  renderJobs();

  // 통계 표시
  document.getElementById('s-grad').textContent = DATA.stats.grad;
  document.getElementById('s-rate').textContent = DATA.stats.rate;
  document.getElementById('s-active').textContent = DATA.stats.active;
  document.getElementById('s-close').textContent = DATA.stats.closing;
  document.getElementById('s-done').textContent = DATA.stats.done||'—';

  renderBanners();
  // ★ 최적화: renderJobs(), renderDeptTable()은 위에서 이미 호출됨 (중복 제거)
});

function renderDeptTable(){
  let tg=0,te=0,ta=0;
  const el = document.getElementById('deptTb');
  if (!el) return;
  el.innerHTML = DATA.depts.map(d=>{
    tg+=d.g;te+=d.e;ta+=d.a;
    const rate=d.g?Math.round(d.e/d.g*100):0;
    const adv=d.g?Math.round(d.a/d.g*100):0;
    return `<tr><td style="text-align:left;font-weight:500">${d.dept}</td><td>${d.g}</td><td>${d.e}</td><td>${d.a}</td>
      <td class="dept-rate">${rate}%</td><td>${adv}%</td></tr>`;
  }).join('')+(tg?`<tr class="dept-total"><td style="text-align:left">전체</td><td>${tg}</td><td>${te}</td><td>${ta}</td>
    <td class="dept-rate">${Math.round(te/tg*100)}%</td><td>${Math.round(ta/tg*100)}%</td></tr>`:'');
}

function renderBanners(){
  document.getElementById('banners').innerHTML = (DATA.banners||[]).map(b=>
    `<a class="banner-item" href="${b.url||'#'}" target="_blank" rel="noopener noreferrer" style="background:${b.color||'#1A3A6B'}">
      <div><div class="banner-title">${b.title}</div>${(b.deadline||b.dl)?`<div class="banner-date">마감 ${b.deadline||b.dl}</div>`:''}</div>
      <div class="banner-arrow">→</div></a>`).join('');
}

function renderJobs(){
  const today=new Date();
  const todayStr=getTodayStr();
  const valid=getFilteredJobs();
  if(!valid.length){
    document.getElementById('jobList').innerHTML='<p style="color:var(--text-sub);font-size:13px;padding:12px 0">해당하는 채용공고가 없습니다.</p>';
    document.getElementById('btnMore').style.display='none';
    return;
  }
  const sorted=[...valid].sort((a,b)=>{
    const todayStr2=getTodayStr();
    const aExp=(a.dl||'').substring(0,10)<todayStr2||!a.active;
    const bExp= b.dl ? (b.dl||'').substring(0,10)<todayStr2 : false;
    if(aExp!==bExp) return aExp?1:-1;        // 진행중 먼저
    const da=new Date((a.dl||'').substring(0,10)+'T00:00:00');
    const db=new Date((b.dl||'').substring(0,10)+'T00:00:00');
    return aExp ? db-da : da-db;             // 진행중: 마감일 오름차순 / 마감: 내림차순
  });
  document.getElementById('jobList').innerHTML = sorted.slice(0,showN).map((j)=>{
    const dlStr=(j.dl||'').substring(0,10);
    const diff= dlStr < todayStr ? -1 : Math.ceil((new Date(dlStr+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
    const urg=diff>=0&&diff<=7;
    const tags=(j.tags||[]).map(t=>`<span class="job-tag">${t}</span>`).join('');
    const origIdx=DATA.jobs.indexOf(j);
    const jobId=j.id!=null?String(j.id):String(origIdx);
    const sm=DATA.statsMap[jobId]||{interest:0,apply:0};
    return `<div class="job-card" onclick="openJob(${origIdx})">
      <div class="job-company">${j.type?`[${j.type}] `:''}${j.co||''}${j.rec?'<span class="job-recommend">학교장추천</span>':''}</div>
      <div class="job-title">${j.job||''}</div>
      <div class="job-meta">${tags}
        ${j.loc?`<span class="job-tag">📍${j.loc}</span>`:''}${j.cnt?`<span class="job-tag">👤${j.cnt}</span>`:''}</div>
      <div class="job-footer">
        <span class="job-deadline${urg?' urgent':''}">
          ${diff<0?'마감 '+dlStr:urg?'마감임박 '+dlStr:'<span style="color:#2563eb">진행중</span>&nbsp;&nbsp;'+dlStr}
        </span>
        <span class="job-detail">상세보기 →</span>
      </div>
      <div class="job-stats">
        <span class="job-stat">👁 ${j.views||0}회</span>
        <span class="job-stat">🤍 관심 ${sm.interest}명</span>
        <span class="job-stat">📝 지원 ${sm.apply}명</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('btnMore').style.display = showN>=sorted.length?'none':'block';
}

function loadMore(){showN+=3;renderJobs();}

let _curJobIdx = -1;

function openJob(i){
  _curJobIdx = i;
  const j=DATA.jobs[i];
  document.getElementById('m-co').textContent=(j.type?`[${j.type}] `:'')+( j.co||'');
  document.getElementById('m-title').textContent=j.job||'';
  document.getElementById('m-job').textContent=j.job||'';
  document.getElementById('m-loc').textContent=j.loc||'';
  document.getElementById('m-cnt').textContent=(j.cnt||'')+( j.cnt?'':'');
  document.getElementById('m-dl').textContent=(j.dl||'').substring(0,10);
  document.getElementById('m-desc').textContent=j.desc||'';
  document.getElementById('m-rec').style.display=j.rec?'block':'none';
  if(j.rec) document.getElementById('m-reccnt').textContent=j.recCnt>0?j.recCnt+'명':'제한없음';
  const fWrap=document.getElementById('m-files');
  const fList=document.getElementById('m-file-list');
  if(j.files&&j.files.length){
    fList.innerHTML=j.files.map(f=>`<a class="file-item" href="${f.url}" target="_blank">📄 ${f.name}</a>`).join('');
    fWrap.style.display='block';
  } else fWrap.style.display='none';
  renderModalButtons(i);
  document.getElementById('jobModal').classList.add('open');
  // 조회수 증가 (비동기, 결과 대기 안함)
  const jId = j.id != null ? String(j.id) : null;
  if(jId) SAMIL_API.incrementView(jId).then(r=>{ if(r.success){ j.views=r.views; } });
}

async function renderModalButtons(i){
  const j = DATA.jobs[i];
  const jobId = j.id != null ? String(j.id) : String(i);
  const el = document.getElementById('modal-action-btns');
  const isAdmin   = sessionStorage.getItem('samilAdminAuth') === '1';
  const isTeacher = !!sessionStorage.getItem('samilTeacherAuth');
  const isStudent = !!sessionStorage.getItem('samilStudentAuth');

  if(isAdmin){
    el.innerHTML=`
      <button class="btn-interest" style="flex:1" onclick="openAdminSubModal('interest','${jobId}')">👥 관심학생 조회</button>
      <button class="apply-btn" style="flex:1" onclick="openAdminSubModal('apply','${jobId}')">📋 지원학생 조회</button>`;
  } else if(isTeacher){
    el.innerHTML=`
      <button class="btn-interest" style="flex:1" onclick="openTeacherApplyModal('${jobId}')">📝 학급학생 지원</button>
      <button class="apply-btn" style="flex:1" onclick="openTeacherReviewModal('${jobId}')">📋 지원조회</button>`;
  } else if(isStudent){
    const ME = JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');
    // 관심 상태 확인 (localStorage 우선)
    const localInts = JSON.parse(localStorage.getItem('interests')||'[]');
    const interested = localInts.includes(i);
    el.innerHTML=`
      <button class="btn-interest${interested?' on':''}" id="btn-interest" onclick="handleStudentInterest(${i},'${jobId}')">${interested?'❤️ 관심등록됨':'🤍 관심등록'}</button>
      <button class="apply-btn" style="flex:2" onclick="handleStudentApply('${jobId}')">지원하기</button>`;
  } else {
    el.innerHTML=`
      <button class="btn-interest" style="flex:1" onclick="alert('로그인 후 관심등록 가능합니다.')">🤍 관심등록</button>
      <button class="apply-btn" style="flex:2" onclick="alert('로그인 후 지원 가능합니다.')">지원하기</button>`;
  }
}

// ── 학생: 관심등록 ──
async function handleStudentInterest(i, jobId){
  const ME = JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');
  const btn = document.getElementById('btn-interest');
  btn.disabled = true;
  const res = await SAMIL_API.toggleInterest({
    jobId, jobName: DATA.jobs[i]?.job||'',
    studentId: ME.id, name: ME.name, dept: ME.dept, grade: ME.grade, cls: ME.cls
  });
  if(!res.success){ alert(res.error||'오류'); btn.disabled=false; return; }
  // localStorage도 동기화
  let arr = JSON.parse(localStorage.getItem('interests')||'[]');
  if(res.interested){ arr.push(i); btn.className='btn-interest on'; btn.textContent='❤️ 관심등록됨'; }
  else { arr=arr.filter(x=>x!==i); btn.className='btn-interest'; btn.textContent='🤍 관심등록'; }
  localStorage.setItem('interests', JSON.stringify(arr));
  btn.disabled = false;
}

// ── 학생: 지원하기 ──
async function handleStudentApply(jobId){
  const ME = JSON.parse(sessionStorage.getItem('samilStudentME')||'{}');
  if(!ME.id){ alert('로그인 후 지원 가능합니다.'); return; }
  if(!confirm('지원하시겠습니까?')) return;
  const j = DATA.jobs[_curJobIdx];
  const res = await SAMIL_API.applyJob({
    jobId, jobName: j?.job||'',
    studentId: ME.id, name: ME.name, dept: ME.dept, grade: ME.grade, cls: ME.cls,
    regType:'학생', regById: ME.id
  });
  alert(res.success ? '✅ 지원 완료되었습니다.' : (res.error||'오류'));
}

// ── 담임: 학급학생 지원 모달 ──
async function openTeacherApplyModal(jobId){
  const ME = JSON.parse(sessionStorage.getItem('samilTeacherME')||'{}');
  document.getElementById('sub-title').textContent = '학급학생 지원';
  document.getElementById('sub-body').innerHTML = '<p style="color:var(--text-sub);font-size:13px">학생 목록 불러오는 중...</p>';
  document.getElementById('sub-footer').innerHTML = '';
  document.getElementById('subModal').classList.add('open');

  // 지원자 목록(중복체크용) + 학생목록 동시 로드
  const [appRes] = await Promise.all([
    SAMIL_API.getApplicants({ teacherId: ME.id, jobId, dept: ME.dept, grade: ME.grade, cls: ME.cls })
  ]);
  const appliedIds = appRes.success ? appRes.data.map(a=>String(a.studentId)) : [];

  // 학생 목록은 index.html이 학생DB를 모르므로 sessionStorage에서 불러오거나 간소화
  const j = DATA.jobs[_curJobIdx];
  const body = document.getElementById('sub-body');
  const footer = document.getElementById('sub-footer');

  // 학생목록 조회
  const stuRes = await SAMIL_API.getStudents({ teacherId: ME.id });
  if(!stuRes.success || !stuRes.data.length){
    body.innerHTML='<p style="color:var(--text-sub);font-size:13px">학생 정보가 없습니다. 생기부를 먼저 업로드해주세요.</p>'; return;
  }
  const students = stuRes.data.filter(s=> String(s.grade)===String(ME.grade) && String(s.cls)===String(ME.cls));

  body.innerHTML=`
    <p style="font-size:12px;color:var(--text-sub);margin-bottom:10px">✅ 이미 지원한 학생은 체크 비활성화됩니다.</p>
    <table class="sub-table">
      <thead><tr><th></th><th>학번</th><th>이름</th><th>성별</th></tr></thead>
      <tbody>${students.map(s=>{
        const done = appliedIds.includes(String(s.id));
        return `<tr>
          <td><input type="checkbox" class="sub-check apply-chk" value="${s.id}" data-name="${s.name||''}" data-dept="${s.dept||''}" data-grade="${s.grade||''}" data-cls="${s.cls||''}" ${done?'disabled checked':''}>
          ${done?'<span class="sub-badge 담임" style="margin-left:4px">지원완료</span>':''}</td>
          <td>${s.id}</td><td>${s.name||''}</td><td>${s.gender||''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  footer.innerHTML=`<button class="apply-btn" onclick="submitTeacherApply('${jobId}','${j?.job||''}')">선택 학생 지원 등록</button>`;
}

async function submitTeacherApply(jobId, jobName){
  const ME = JSON.parse(sessionStorage.getItem('samilTeacherME')||'{}');
  const checked = [...document.querySelectorAll('.apply-chk:checked:not(:disabled)')];
  if(!checked.length){ alert('지원할 학생을 선택해주세요.'); return; }
  const students = checked.map(c=>({ id:c.value, name:c.dataset.name, dept:c.dataset.dept, grade:c.dataset.grade, cls:c.dataset.cls }));
  const res = await SAMIL_API.applyJobs({ teacherId: ME.id, jobId, jobName, students: JSON.stringify(students) });
  if(res.success) alert(`✅ ${res.added}명 지원 완료 (중복 ${res.skipped}명 제외)`);
  else alert(res.error||'오류');
  closeModal('subModal');
}

async function deleteApplyRow(rowNum){
  if(!confirm('삭제하시겠습니까?')) return;
  const ME = JSON.parse(sessionStorage.getItem('samilTeacherME')||'{}');
  const isAdmin = sessionStorage.getItem('samilAdminAuth') === '1';
  const res = await SAMIL_API.deleteApply(isAdmin ? { token:'samil_admin_2024', rowNum } : { teacherId: ME.id, rowNum });
  if(res.success){ document.getElementById(`row-${rowNum}`)?.remove(); }

}

      </tr>`).join('')}</tbody>
    </table>`;
  } else {
    body.innerHTML=`<table class="sub-table">
      <thead><tr><th>학번</th><th>이름</th><th>학과</th><th>학년/반</th><th>지원일</th><th>등록</th><th>관리</th></tr></thead>
      <tbody id="admin-apply-tb">${list.map(a=>`<tr id="row-${a._row}">
        <td>${a.studentId}</td><td>${a.name}</td><td>${a.dept}</td>
        <td>${a.grade}학년 ${a.cls}반</td><td>${(a.date||'').substring(0,10)}</td>
        <td><span class="sub-badge ${a.regType}">${a.regType||'학생'}</span></td>
        <td><button style="font-size:12px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff" onclick="deleteApplyRow(${a._row})">삭제</button></td>
      </tr>`).join('')}</tbody>
    </table>`;
  }
}

function closeModal(id,e){if(!e||e.target.id===id) document.getElementById(id).classList.remove('open');}
function toggleMenu(){document.getElementById('navMenu').classList.toggle('open');}
function closeMenu(){document.getElementById('navMenu').classList.remove('open');}
</script>
