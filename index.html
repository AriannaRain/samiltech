<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼일공업고등학교 취업정보 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1A3A6B;--primary-light:#2E5FAD;--accent:#E8740A;--accent-light:#FF9E3A;
  --bg:#F4F6FA;--card:#fff;--text:#1C2B3A;--text-sub:#5A6A7E;--border:#DDE3EE;
  --nav-h:60px;--radius:12px;--shadow:0 2px 12px rgba(26,58,107,.10)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding-top:var(--nav-h)}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--primary);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.nav-title{color:#fff;font-weight:700;font-size:16px}
.nav-title span{color:rgba(255,255,255,.65);font-size:10px;display:block;font-weight:400}
.nav-menu{display:flex;gap:4px;align-items:center}
.nav-menu a{color:rgba(255,255,255,.8);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}
.nav-menu a:hover,.nav-menu a.active{background:rgba(255,255,255,.15);color:#fff}
.nav-login{background:var(--accent) !important;color:#fff !important}
.nav-user{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.9);font-size:13px}
.nav-user-name{font-weight:600;color:#fff}
.nav-user-role{background:rgba(255,255,255,.15);border-radius:6px;padding:2px 8px;font-size:11px}
.nav-user-goto{background:var(--accent);color:#fff !important;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none;transition:.2s}
.nav-user-goto:hover{background:var(--accent-light) !important}
.nav-user-logout{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85) !important;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;transition:.2s}
.nav-user-logout:hover{background:rgba(255,255,255,.22) !important;color:#fff !important}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{width:22px;height:2px;background:#fff;border-radius:2px}
@media(max-width:768px){
  .nav-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:var(--primary);flex-direction:column;padding:12px}
  .nav-menu.open{display:flex}
  .nav-menu a{padding:12px 16px}
  .hamburger{display:flex}
}
.hero{background:var(--primary);padding:40px 24px 36px;color:#fff;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:12px;margin-bottom:16px}
.hero h1{font-size:28px;font-weight:700;margin-bottom:4px;line-height:1.3}
.hero h1 span{color:var(--accent-light);display:block}
.hero p{font-size:13px;opacity:.7;margin-bottom:28px}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:860px;margin:0 auto}
.stat-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px 8px;text-align:center}
.stat-icon{font-size:20px;margin-bottom:4px}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:10px;color:rgba(255,255,255,.7);margin-top:3px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(3,1fr)}.stat-card:nth-child(4),.stat-card:nth-child(5){display:none}}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.section-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px;display:block}
.banner-slider{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
.banner-slider::-webkit-scrollbar{display:none}
.banner-item{flex:0 0 280px;border-radius:10px;padding:18px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;min-height:90px;transition:.2s}
.banner-item:hover{transform:translateY(-2px)}
.banner-title{font-size:14px;font-weight:600}
.banner-date{font-size:11px;opacity:.75;margin-top:4px}
.banner-arrow{text-align:right;font-size:16px;margin-top:8px}
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.job-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;border:1px solid var(--border)}
.job-card:hover{transform:translateY(-2px);border-color:var(--primary-light)}
.job-company{font-size:12px;color:var(--text-sub);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.job-recommend{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.job-title{font-size:15px;font-weight:700;margin-bottom:8px}
.job-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.job-tag{background:var(--bg);color:var(--text-sub);font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
.job-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.job-deadline{font-size:12px;color:var(--text-sub)}
.job-deadline.urgent{color:#E53E3E;font-weight:600}
.job-detail{font-size:12px;color:var(--primary-light);font-weight:600}
.btn-more{display:block;width:100%;text-align:center;padding:11px;border:2px solid var(--border);border-radius:var(--radius);color:var(--text-sub);font-size:14px;cursor:pointer;background:#fff;margin-bottom:28px;transition:.2s}
.btn-more:hover{border-color:var(--primary);color:var(--primary)}
.dept-table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:32px}
.dept-table{width:100%;border-collapse:collapse}
.dept-table th{background:var(--primary);color:#fff;padding:11px 14px;font-size:13px;text-align:center}
.dept-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);text-align:center}
.dept-table tr:last-child td{border-bottom:none}
.dept-table tr:hover td{background:var(--bg)}
.dept-rate{font-weight:700;color:var(--primary)}
.dept-total td{background:var(--bg);font-weight:700}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal-header{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.modal-body{padding:18px}
.modal-company{font-size:12px;color:var(--text-sub);margin-bottom:3px}
.modal-title{font-size:19px;font-weight:700;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info-item{background:var(--bg);border-radius:8px;padding:10px 12px}
.info-label{font-size:11px;color:var(--text-sub);margin-bottom:2px}
.info-value{font-size:14px;font-weight:600}
.recommend-box{background:#FFF3E0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.modal-desc{font-size:14px;line-height:1.75;white-space:pre-line}
.apply-btn{display:block;background:var(--primary);color:#fff;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;flex:2}
.btn-interest{flex:1;padding:13px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-sub);transition:.2s}
.btn-interest.on{border-color:var(--accent);color:var(--accent);background:#FFF3E0}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--text)}
.file-item:hover{background:var(--border)}
.login-modal{max-width:380px}
.login-tab{display:flex;gap:4px;margin-bottom:18px;background:var(--bg);padding:4px;border-radius:10px}
.login-tab button{flex:1;padding:8px;border:none;background:none;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text-sub);font-family:inherit}
.login-tab button.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary-light)}
.btn-submit{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
footer{background:var(--primary);color:rgba(255,255,255,.65);text-align:center;padding:20px;font-size:12px}
footer strong{color:#fff}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo" style="font-size:10px;line-height:1.2">삼일<br>공고</div>
    <div class="nav-title">취업정보 포털<span>SAMIL JOBS</span></div>
  </div>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <div class="nav-menu" id="navMenu">
    <a href="#home" class="active" onclick="closeMenu()">홈</a>
    <a href="#jobs" onclick="closeMenu()">채용공고</a>
    <a href="#status" onclick="closeMenu()">취업현황</a>
    <!-- 로그아웃 상태 -->
    <a href="#" class="nav-login" id="navLoginBtn" onclick="openLogin();closeMenu();return false">로그인</a>
    <!-- 로그인 상태 (동적 교체) -->
    <div class="nav-user" id="navUser" style="display:none">
      <span class="nav-user-role" id="navUserRole"></span>
      <span class="nav-user-name" id="navUserName"></span>
      <a href="#" class="nav-user-goto" id="navUserGoto"></a>
      <a href="#" class="nav-user-logout" onclick="logoutIndex();return false">로그아웃</a>
    </div>
  </div>
</nav>

<section class="hero" id="home">
  <div class="hero-inner">
  <div class="hero-badge">🏫 2025학년도 취업현황</div>
  <h1>삼일공업고등학교<span>취업정보 포털</span></h1>
  <p>채용공고부터 취업현황까지, 한 곳에서 확인하세요</p>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon">🎓</div><div class="stat-num" id="s-grad">-</div><div class="stat-label">전년도 졸업생</div></div>
    <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-num" id="s-rate">-</div><div class="stat-label">전년도 취업률</div></div>
    <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-num" id="s-active">-</div><div class="stat-label">진행중 공고</div></div>
    <div class="stat-card"><div class="stat-icon">⏰</div><div class="stat-num" id="s-close">-</div><div class="stat-label">마감임박</div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-num" id="s-done">-</div><div class="stat-label">올해 마감</div></div>
  </div>
  </div>
</section>

<div class="container">
  <div class="section-title">공지 및 안내</div>
  <div class="banner-slider" id="banners"></div>

  <div id="jobs">
    <div class="section-title">최신 채용공고</div>
    <div class="jobs-grid" id="jobList"></div>
    <button class="btn-more" id="btnMore" onclick="loadMore()">공고 더 보기</button>
  </div>

  <div id="status">
    <div class="section-title">학과별 취업현황 (전년도)</div>
    <div class="dept-table-wrap">
      <table class="dept-table">
        <thead><tr><th>학과</th><th>졸업인원</th><th>취업자</th><th>진학자</th><th>취업률</th><th>진학률</th></tr></thead>
        <tbody id="deptTb"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 채용 상세 -->
<div class="modal-overlay" id="jobModal" onclick="closeModal('jobModal',event)">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-company" id="m-co"></div><div class="modal-title" id="m-title"></div></div>
      <button class="modal-close" onclick="closeModal('jobModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="info-grid">
        <div class="info-item"><div class="info-label">직무</div><div class="info-value" id="m-job"></div></div>
        <div class="info-item"><div class="info-label">근무지</div><div class="info-value" id="m-loc"></div></div>
        <div class="info-item"><div class="info-label">모집인원</div><div class="info-value" id="m-cnt"></div></div>
        <div class="info-item"><div class="info-label">마감일</div><div class="info-value" id="m-dl"></div></div>
      </div>
      <div id="m-rec" style="display:none" class="recommend-box">🏫 <strong>학교장 추천전형</strong> — 추천 인원: <span id="m-reccnt"></span>명</div>
      <div class="modal-desc" id="m-desc"></div>
      <div id="m-files" style="display:none;margin-top:14px">
        <div style="font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px">📎 붙임파일</div>
        <div id="m-file-list"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn-interest" id="btn-interest" onclick="toggleInterest()">🤍 관심등록</button>
        <button class="apply-btn" style="flex:2" onclick="alert('로그인 후 지원 가능합니다.')">지원하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 로그인 -->
<div class="modal-overlay" id="loginModal" onclick="closeModal('loginModal',event)">
  <div class="modal login-modal">
    <div class="modal-header">
      <div style="font-size:17px;font-weight:700">로그인</div>
      <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="login-tab">
        <button class="active" onclick="switchTab('st',this)">학생</button>
        <button onclick="switchTab('tc',this)">담임교사</button>
        <button onclick="switchTab('ad',this)">관리자</button>
      </div>
      <div id="tab-st">
        <div class="form-group"><label>학과</label><select id="l-dept"><option value="">선택</option></select></div>
        <div class="form-group"><label>학번</label><input id="l-id" placeholder="예: 3104" onkeydown="if(event.key==='Enter')loginStudent()"></div>
        <div class="form-group"><label>비밀번호</label><input type="password" id="l-pw" placeholder="초기: 생년월일 6자리" onkeydown="if(event.key==='Enter')loginStudent()"></div>
        <button class="btn-submit" onclick="alert('Google Sheets 연동 후 활성화')">로그인</button>
      </div>
      <div id="tab-tc" style="display:none">
        <div class="form-group"><label>아이디</label><input id="t-id" onkeydown="if(event.key==='Enter')loginTeacher()"></div>
        <div class="form-group"><label>비밀번호</label><input type="password" id="t-pw" onkeydown="if(event.key==='Enter')loginTeacher()"></div>
        <button class="btn-submit" onclick="loginTeacher()">로그인</button>
      </div>
      <div id="tab-ad" style="display:none">
        <div class="form-group"><label>관리자 비밀번호</label><input type="password" id="a-pw" onkeydown="if(event.key==='Enter')tryAdmin()"></div>
        <button class="btn-submit" onclick="tryAdmin()">로그인</button>
      </div>
    </div>
  </div>
</div>

<footer><strong>삼일공업고등학교</strong> 특성화취창업지원부 | 경기도 수원시</footer>

<script>
// ── 샘플 데이터 (Google Sheets 연동 전) ──
const DATA = {
  stats:{grad:'312명',rate:'78%',active:'8개',closing:'3개',done:'24개'},
  banners:[
    {title:'2026 상반기 현장실습 기업 모집',url:'#',deadline:'2026.03.31',color:'#1A3A6B'},
    {title:'취업역량 강화 특강 안내',url:'#',deadline:'2026.02.28',color:'#E8740A'},
    {title:'NCS 직무능력 경진대회 참가 안내',url:'#',deadline:'2026.04.15',color:'#2E5FAD'},
    {title:'2026 수원 취업박람회 사전 신청',url:'#',deadline:'2026.05.10',color:'#1D6A4A'},
  ],
  jobs:[
    {co:'(주)삼성전자',title:'전자기기 생산',job:'생산관리',loc:'수원',cnt:3,dl:'2026.03.31',tags:['전자과','정규직'],rec:true,recCnt:2,desc:'전자기기 생산 및 품질 관리 업무\n\n• 근무형태: 정규직\n• 급여: 협의\n• 복리후생: 4대보험, 식대'},
    {co:'LG이노텍',title:'PCB 생산',job:'생산',loc:'평택',cnt:5,dl:'2026.04.10',tags:['전자과'],rec:false,recCnt:0,desc:'PCB 생산 라인 운영 및 품질 검사'},
    {co:'(주)현대모비스',title:'자동차 부품 제조',job:'제조',loc:'화성',cnt:4,dl:'2026.03.20',tags:['기계과','정규직'],rec:true,recCnt:3,desc:'자동차 부품 제조 및 조립 업무'},
    {co:'(주)LS일렉트릭',title:'전기 시공',job:'시공',loc:'안양',cnt:6,dl:'2026.04.20',tags:['전기과'],rec:true,recCnt:4,desc:'전기 시공 및 유지보수 업무'},
    {co:'KT&G',title:'설비 유지보수',job:'유지보수',loc:'수원',cnt:2,dl:'2026.05.01',tags:['기계과','전기과'],rec:false,recCnt:0,desc:'생산 설비 유지보수 및 점검'},
    {co:'KCC건설',title:'현장 관리',job:'현장관리',loc:'서울',cnt:3,dl:'2026.03.25',tags:['건설과'],rec:false,recCnt:0,desc:'건설 현장 관리 및 안전 감독'},
  ],
  depts:[
    {dept:'전자과',g:68,e:54,a:8},{dept:'기계과',g:72,e:58,a:6},
    {dept:'전기과',g:64,e:50,a:9},{dept:'화학공업과',g:45,e:35,a:5},
    {dept:'건설과',g:38,e:28,a:4},{dept:'정보통신과',g:55,e:42,a:8},
  ]
};

let showN = 4;

window.addEventListener('DOMContentLoaded',()=>{
  // 통계
  document.getElementById('s-grad').textContent = DATA.stats.grad;
  document.getElementById('s-rate').textContent = DATA.stats.rate;
  document.getElementById('s-active').textContent = DATA.stats.active;
  document.getElementById('s-close').textContent = DATA.stats.closing;
  document.getElementById('s-done').textContent = DATA.stats.done;

  // 배너
  document.getElementById('banners').innerHTML = DATA.banners.map(b=>
    `<a class="banner-item" href="${b.url}" style="background:${b.color}">
      <div><div class="banner-title">${b.title}</div><div class="banner-date">마감 ${b.deadline}</div></div>
      <div class="banner-arrow">→</div></a>`).join('');

  renderJobs();

  // 취업현황
  let tg=0,te=0,ta=0;
  document.getElementById('deptTb').innerHTML = DATA.depts.map(d=>{
    tg+=d.g;te+=d.e;ta+=d.a;
    return `<tr><td style="text-align:left;font-weight:500">${d.dept}</td><td>${d.g}</td><td>${d.e}</td><td>${d.a}</td>
      <td class="dept-rate">${Math.round(d.e/d.g*100)}%</td><td>${Math.round(d.a/d.g*100)}%</td></tr>`;
  }).join('')+`<tr class="dept-total"><td style="text-align:left">전체</td><td>${tg}</td><td>${te}</td><td>${ta}</td>
    <td class="dept-rate">${Math.round(te/tg*100)}%</td><td>${Math.round(ta/tg*100)}%</td></tr>`;

  // 학과 옵션
  const sel=document.getElementById('l-dept');
  DATA.depts.forEach(d=>{const o=document.createElement('option');o.value=d.dept;o.textContent=d.dept;sel.appendChild(o);});
});

function renderJobs(){
  const today=new Date();
  document.getElementById('jobList').innerHTML = DATA.jobs.slice(0,showN).map((j,i)=>{
    const dl=new Date(j.dl.replace(/\./g,'-'));
    const diff=Math.ceil((dl-today)/86400000);
    const urg=diff<=7&&diff>=0;
    return `<div class="job-card" onclick="openJob(${i})">
      <div class="job-company">${j.co}${j.rec?'<span class="job-recommend">학교장추천</span>':''}</div>
      <div class="job-title">${j.title}</div>
      <div class="job-meta">${j.tags.map(t=>`<span class="job-tag">${t}</span>`).join('')}
        <span class="job-tag">📍${j.loc}</span><span class="job-tag">👤${j.cnt}명</span></div>
      <div class="job-footer">
        <span class="job-deadline${urg?' urgent':''}">마감 ${j.dl}${urg?' ⚠':''}</span>
        <span class="job-detail">상세보기 →</span>
      </div></div>`;
  }).join('');
  document.getElementById('btnMore').style.display = showN>=DATA.jobs.length?'none':'block';
}

function loadMore(){showN+=4;renderJobs();}

function openJob(i){
  const j=DATA.jobs[i];
  document.getElementById('m-co').textContent=j.co;
  document.getElementById('m-title').textContent=j.title;
  document.getElementById('m-job').textContent=j.job;
  document.getElementById('m-loc').textContent=j.loc;
  document.getElementById('m-cnt').textContent=j.cnt+'명';
  document.getElementById('m-dl').textContent=j.dl;
  document.getElementById('m-desc').textContent=j.desc;
  document.getElementById('m-rec').style.display=j.rec?'block':'none';
  if(j.rec) document.getElementById('m-reccnt').textContent=j.recCnt;
  // 붙임파일
  const fWrap=document.getElementById('m-files');
  const fList=document.getElementById('m-file-list');
  if(j.files&&j.files.length){
    fList.innerHTML=j.files.map(f=>`<a class="file-item" href="${f.url}" target="_blank">📄 ${f.name}</a>`).join('');
    fWrap.style.display='block';
  } else fWrap.style.display='none';
  // 관심등록 상태
  const interests=JSON.parse(localStorage.getItem('interests')||'[]');
  const btn=document.getElementById('btn-interest');
  btn.className='btn-interest'+(interests.includes(i)?' on':'');
  btn.textContent=interests.includes(i)?'❤️ 관심등록됨':'🤍 관심등록';
  btn.dataset.idx=i;
  document.getElementById('jobModal').classList.add('open');
}

function toggleInterest(){
  const btn=document.getElementById('btn-interest');
  const i=parseInt(btn.dataset.idx);
  let arr=JSON.parse(localStorage.getItem('interests')||'[]');
  if(arr.includes(i)){arr=arr.filter(x=>x!==i);btn.className='btn-interest';btn.textContent='🤍 관심등록';}
  else{arr.push(i);btn.className='btn-interest on';btn.textContent='❤️ 관심등록됨';}
  localStorage.setItem('interests',JSON.stringify(arr));
}

function closeModal(id,e){if(!e||e.target.id===id) document.getElementById(id).classList.remove('open');}
function openLogin(){document.getElementById('loginModal').classList.add('open');}
function switchTab(tab,btn){
  ['st','tc','ad'].forEach(t=>document.getElementById('tab-'+t).style.display='none');
  document.getElementById('tab-'+tab).style.display='block';
  document.querySelectorAll('.login-tab button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function loginStudent(){
  const dept=document.getElementById('l-dept').value;
  const id=document.getElementById('l-id').value.trim();
  const pw=document.getElementById('l-pw').value;
  if(!id||!pw){alert('학번과 비밀번호를 입력하세요');return;}
  const DB=JSON.parse(localStorage.getItem('samilAdmin')||'{}');
  const found=(DB.students||[]).find(s=>s.id===id&&s.pw===pw);
  if(found){
    sessionStorage.setItem('samilStudentAuth',found.id);
    closeModal('loginModal');
    window.location.href='student.html';
  } else { document.getElementById('l-pw').value=''; alert('아이디 또는 비밀번호가 틀렸습니다.'); }
}
function loginTeacher(){
  const id=document.getElementById('t-id').value.trim();
  const pw=document.getElementById('t-pw').value;
  if(!id||!pw){alert('아이디와 비밀번호를 입력하세요');return;}
  const DB=JSON.parse(localStorage.getItem('samilAdmin')||'{}');
  const found=(DB.teachers||[]).find(t=>t.id===id&&t.pw===pw);
  if(found){
    sessionStorage.setItem('samilTeacherAuth',found.id);
    closeModal('loginModal');
    setNavUser('teacher',found.name+' 선생님','담임교사 페이지 →','teacher.html');
  } else { document.getElementById('t-pw').value=''; alert('아이디 또는 비밀번호가 틀렸습니다.'); }
}
function tryAdmin(){
  const pw=document.getElementById('a-pw').value;
  const masterPw=localStorage.getItem('samilMasterPw')||'samil_master';
  const commonPw=localStorage.getItem('samilCommonPw')||'samil2024';
  if(pw===masterPw||pw===commonPw){
    sessionStorage.setItem('samilAdminAuth','1');
    closeModal('loginModal');
    setNavUser('admin','관리자','관리자 페이지 →','admin.html');
  } else {
    document.getElementById('a-pw').value='';
    alert('비밀번호가 틀렸습니다.');
  }
}
function setNavUser(role,name,linkText,href){
  document.getElementById('navLoginBtn').style.display='none';
  const nu=document.getElementById('navUser');
  nu.style.display='flex';
  document.getElementById('navUserRole').textContent=role==='admin'?'🔧 관리자':'👨‍🏫 담임교사';
  document.getElementById('navUserName').textContent=name;
  const g=document.getElementById('navUserGoto');
  g.textContent=linkText; g.href=href;
}
function logoutIndex(){
  sessionStorage.removeItem('samilAdminAuth');
  sessionStorage.removeItem('samilTeacherAuth');
  document.getElementById('navLoginBtn').style.display='';
  document.getElementById('navUser').style.display='none';
}
function toggleMenu(){document.getElementById('navMenu').classList.toggle('open');}
function closeMenu(){document.getElementById('navMenu').classList.remove('open');}
// 새로고침 후 로그인 상태 복원
(function(){
  if(sessionStorage.getItem('samilAdminAuth')){
    setNavUser('admin','관리자','관리자 페이지 →','admin.html');
  } else if(sessionStorage.getItem('samilTeacherAuth')){
    const _DB=JSON.parse(localStorage.getItem('samilAdmin')||'{}');
    const _f=(_DB.teachers||[]).find(t=>t.id===sessionStorage.getItem('samilTeacherAuth'));
    if(_f) setNavUser('teacher',_f.name+' 선생님','담임교사 페이지 →','teacher.html');
  }
})();
</script>
